function portrait(p,big=false){let c=[['#d6aa87','#24202a','#65868a'],['#c99a78','#39291f','#94584a'],['#dfb79c','#221f2b','#79658c'],['#cba17d','#493625','#74845c']][p.t];return `<svg class="portrait ${big?'large':''}" viewBox="0 0 40 44" role="img" aria-label="${esc(name(p))}"><rect width="40" height="44" fill="#2b2530"/><path d="M3 44V35L12 30H28L37 35V44" fill="${p.job?jobs[p.job].color:c[2]}"/><path d="M16 26H24V34H16M10 12H30V25L26 30H15L10 24Z" fill="${c[0]}"/><path d="M8 20V10L13 4H28L33 11V22H29V14L22 12L15 15H11V21Z" fill="${c[1]}"/><path d="M14 20H17M24 20H27" stroke="#292128" stroke-width="2"/><path d="M18 26H23" stroke="#9d6657"/><path d="M12 32L19 39L27 32" fill="none" stroke="#c7ac72" stroke-width="2"/></svg>`}function stat(k,v){return `<div class="stat"><span>${k}</span><span>${v}</span></div>`}function fold(id,title,body,force=false){return `<details ${folds[id]||force?'open':''} ontoggle="folds['${id}']=this.open"><summary>${title}</summary><div>${body}</div></details>`}
function render(){document.documentElement.lang=lang;document.body.classList.toggle('ko',lang==='ko');document.title=T('title');$('title').textContent=T('title');$('language').textContent=B('한국어','English');for(let [id,k] of [['ledgerHeading','ledger'],['registerHeading','register'],['innHeading','inn'],['employerHeading','employer'],['rule','rule'],['contractButton','contract'],['borderHeading','border'],['latestHeading','latest'],['journalButton','journal'],['fightShortcut','battle'],['previewShortcut','preview']])$(id).textContent=T(k);$('capacity').textContent=s.people.length+' / '+s.capacity;$('inn').setAttribute('aria-label',B('Guests eating and walking in an inn','식사하고 거니는 여관 손님들'));$('horrors').setAttribute('aria-label',B('Five eldritch creatures','다섯 마리의 이형 괴물'));$('tabs').innerHTML=['reception','assignments','battle','shop','accounts','records'].map(k=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${T(k)}</button>`).join('');$('totals').innerHTML=`<span>${T('day')} ${s.day}/20</span>`+['gold','mana','sup'].map(k=>`<span>${T(k)} <strong>${s[k]}</strong></span>`).join('');$('operations').innerHTML=`<button ${s.ended?'disabled':''} class="primary" onclick="endDay()">${T('end')}</button><button onclick="saveGame()">${T('save')}</button><button onclick="loadGame()">${T('load')}</button>`;$('storage').textContent='';$('roster').innerHTML=s.people.map(p=>`<button class="person ${p.id===selected?'selected':''}" onclick="selected=${p.id};tab='reception';render()">${portrait(p)}<span>${esc(name(p))}<br><small>${p.task?T('deployed'):p.job?L(jobs[p.job].name):T('noClass')} · ${power(p)}</small></span></button>`).join('');$('latest').textContent=L(s.logs[0]?.text||['','']);$('threat').innerHTML=stat(T('pressure'),s.pressure+'/100')+`<div class="meter"><i style="width:${s.pressure}%"></i></div>`+stat(T('karma'),s.karma)+stat(T('undead'),s.undead);if(tab==='reception')reception();if(tab==='assignments')assignments();if(tab==='battle')battlePage();if(tab==='shop')shopPage();if(tab==='accounts')$('page').innerHTML='<h2>'+T('accounts')+'</h2>'+['gold','mana','sup','rep','hr'].map(k=>stat(T(k),s[k])).join('')+stat(T('might'),might())+stat(T('undead'),s.undead)+stat(T('upkeep'),Math.ceil(s.hr/3)+s.people.length)+['gold','mana','sup'].map(k=>stat(T(k)+' · '+T('gain'),'+'+s.upgrades[k]*25+'%')).join('');if(tab==='records')$('page').innerHTML='<h2>'+T('records')+'</h2>'+s.logs.map(l=>`<div class="entry">${T('day')} ${l.day} · ${esc(L(l.text))}</div>`).join('');tutorial();let chat=$('chat');if(chat)chat.scrollTop=chat.scrollHeight}
function reception(){let p=current();if(!p)return;let t=templates[p.t],dis=p.task||s.ended?'disabled':'';let dossier=`<span class="tag">${t.mbti}</span><span class="tag">${L(t.alignment)}</span><p>${T('record')}: ${L(t.record)}</p><p>${B('Previous work','전생의 일')}: ${L(t.previous)}</p><p class="scene">${L(t.story)}</p>`;let stats=['trust','commit','strain','fear'].map(k=>stat(T(k),p[k])).join('')+stat(T('health'),p.hp)+stat(T('level'),p.level)+stat(T('combat'),power(p))+stat(T('gear'),p.gear);let services=`<div class="row">${[['window',4,'mana',p.window,'windowOn'],['pocket',6,'mana',p.pocket,'pocketOn'],['bless',10,'mana',p.blessing,'blessOn'],['equip',18+12*p.gear,'gold',p.gear>=4,''],['rest',5,'sup',false,'']].map(([a,n,k,on,label])=>`<button ${dis||on?'disabled':''} onclick="act('${a}')">${on?T(label||'max'):T(a)+' · '+n+' '+T(k)}</button>`).join('')}</div>`;$('page').innerHTML=`<div class="interactionHeader"><div class="identity">${portrait(p,true)}<div><h2>${esc(name(p))}</h2><small>${p.job?L(jobs[p.job].name):T('noClass')} · ${p.task?T('deployed'):T('atInn')} · ${T('combat')} ${power(p)}</small></div></div><div class="channels">${['human','voice','system'].map(k=>`<button ${dis} class="${channel===k?'active':''}" aria-pressed="${channel===k}" onclick="contact('${k}')">${T(k)}</button>`).join('')}</div></div><div id="chat" class="conversation" role="log" aria-live="polite">${p.chat.map(c=>c.role==='outcome'?`<div class="outcome">${esc(L(c.text))}</div>`:`<div class="bubble ${c.role}"><span class="speaker">${c.role==='player'?esc(name(p)):T(c.role==='system'?'systemName':'you')}</span>${esc(L(c.text))}</div>`).join('')}</div><div class="row">${['listen','explain','choice'].map(k=>`<button ${dis} onclick="act('${k}')">${T(k)}</button>`).join('')}</div>${careerPanel(p)}${fold('services',T('services'),services,s.tutorial===2)}<div class="detailGrid"><div>${fold('dossier',T('dossier'),dossier)}</div><div>${fold('stats',T('stats'),stats)}</div></div>${fold('restricted',T('restricted'),'<div class="row"><button '+(s.ended?'disabled':'')+' onclick="intervene(\'return\')">'+T('return')+'</button><button '+(s.ended?'disabled':'')+' class="danger" onclick="intervene(\'kill\')">'+T('kill')+'</button></div>')}`}
function careerPanel(p){if(p.job||!p.window)return '';return `<div class="career"><h3>${T('career')}</h3><p>${esc(name(p))}: “${B('I used to be a '+templates[p.t].previous[0].toLowerCase()+'. Does that have to be who I am here?','전에는 '+templates[p.t].previous[1]+' 일을 했어요. 여기서도 그래야 하나요?')}”</p><small>${T('advice')}</small><div class="advice">${[['past','Draw on your former life','전생의 경험을 살려 보기'],['new','Explore something unfamiliar','새로운 즐거움을 찾아보기'],['protect','Consider protecting others','다른 사람을 지키는 길'],['own','Choose without my advice','조언 없이 스스로 고르기']].map(([k,en,ko])=>`<button ${p.task||s.ended?'disabled':''} onclick="careerAdvice('${k}')">${B(en,ko)}</button>`).join('')}</div></div>`}
function chooseJob(p,a){let m={past:['healer','warden','necro','priest'],new:['necro','priest','healer','warden'],protect:['priest','healer','warden','healer'],own:['healer','necro','priest','warden']};return p.trust<40&&Math.random()<.55?m.own[p.t]:m[a][p.t]}
function careerAdvice(a){let p=current();if(!ready(p)||p.job||!p.window)return;let j=chooseJob(p,a);p.job=j;say(p,'you','There is a direction you could explore. The choice must be yours.','살펴볼 방향은 있어요. 선택은 당신의 것이어야 합니다.');let r={healer:['I want to mend things without disappearing into the work. I choose Healer.','일 속에서 저를 잃지 않고 무언가를 고치고 싶어요. 치유사의 길을 택할게요.'],priest:['Not because I know the answers. I want to give people somewhere to put their hope. I choose Priest.','답을 알아서가 아니에요. 사람들이 희망을 둘 곳을 만들고 싶어요. 사제가 될게요.'],necro:['The dead were people too. I want to understand what remains. I choose Necromancer.','망자도 사람이었잖아요. 남겨진 것들을 이해하고 싶어요. 강령술사를 택할게요.'],warden:['I know what it means to be cornered. I want to stand between someone else and that feeling. I choose Warden.','몰리는 기분을 알아요. 다른 사람에게 그런 일이 닥치면 앞을 막고 싶어요. 수호자가 될게요.']};say(p,'player',...r[j]);result(p,'Permanent class choice · Combat +'+jobs[j].bonus,'영구 직업 선택 · 전투력 +'+jobs[j].bonus);logP(p,'Chose '+jobs[j].name[0]+'.',jobs[j].name[1]+'의 길을 선택했습니다.');render();show(`<div class="magic"><div class="circle"><div class="glyphs">${jobs[j].glyph}</div></div><h2>${B(esc(name(p))+' became a '+L(jobs[j].name)+'!',esc(name(p))+' 님이 '+L(jobs[j].name)+'(이)가 되었습니다!')}</h2><p>${B('A choice made freely. A new chapter begins.','스스로 내린 선택. 새로운 장이 시작됩니다.')}</p><button onclick="closeModal()">${T('acceptClass')}</button></div>`)}
function assignments(){$('page').innerHTML='<h2>'+T('assignments')+'</h2><p>'+T('assigning')+': '+esc(current()?name(current()):'—')+'</p>'+quests.map((q,i)=>`<article class="mission paper"><h3>${L(q.name)}</h3><p>${L(q.desc)}</p><details><summary style="font:inherit;color:#62492e">${T('rewards')}</summary><p>${income('gold',q.gold)} ${T('gold')} · ${income('mana',q.mana)} ${T('mana')} · ${q.sup>0?income('sup',q.sup):q.sup} ${T('sup')} · ${q.rep} ${T('rep')}<br>${T(q.risk>20?'high':q.risk>8?'moderate':'low')}</p></details><div class="row">${['ask','bonus','threat'].map(k=>`<button ${s.ended?'disabled':''} class="${k==='threat'?'danger':''}" onclick="assign(${i},'${k}')">${T(k)}</button>`).join('')}</div></article>`).join('')}
function eligible(p){return p.window&&!p.task&&p.hp>=30&&power(p)>=FIGHT_RATING&&p.gear>=FIGHT_GEAR&&p.foughtDay!==s.day}function eligibility(p){let a=[];if(!p.window)a.push(B('Status locked','상태창 필요'));if(p.task)a.push(T('deployed'));if(power(p)<250)a.push(B('Rating below 250','전투력 250 미만'));if(p.hp<30)a.push(B('Health below 30','체력 30 미만'));if(p.foughtDay===s.day)a.push(B('Already fought today','오늘 교전 완료'));return a.join(' · ')}function effective(p){return power(p)*p.hp/100*(1-p.strain/250)}function enemyStrength(){return Math.round(270+s.pressure*2+s.encounters*18)}
function battlePage(){chosen=new Set([...chosen].filter(id=>s.people.some(p=>p.id===id&&eligible(p))));let n=s.people.filter(p=>chosen.has(p.id)).reduce((v,p)=>v+effective(p),0);$('page').innerHTML=`<h2>${T('battle')}</h2><p>${B('Test requirements: rating 250+, equipment tier 0+, status open, health 30+. Choose one or several Players.','테스트 조건: 전투력 250 이상, 장비 0단계 이상, 상태창, 체력 30 이상. 한 명 또는 여러 명을 선택하세요.')}</p><button onclick="previewBattle()">${T('preview')}</button>${s.people.map(p=>`<label class="selectrow ${eligible(p)?'':'locked'}"><input type="checkbox" ${chosen.has(p.id)?'checked':''} ${eligible(p)&&!s.ended?'':'disabled'} onchange="toggleFighter(${p.id},this.checked)">${portrait(p)}<span>${esc(name(p))} · ${p.job?L(jobs[p.job].name):T('noClass')}<br><small>${T('combat')} ${power(p)} · ${T('gear')} ${p.gear} · ${T('health')} ${p.hp}<br>${eligible(p)?T('ready'):eligibility(p)}</small></span></label>`).join('')}<div class="resultbox">${T('selected')}: ${chosen.size} · ${B('Field strength','실전 전력')}: ${Math.round(n)} · ${B('Enemy','적')}: ${enemyStrength()}</div><small>${B('Each person fights once per day. Minimum eligibility does not guarantee victory.','각 인원은 하루 한 번 교전합니다. 최소 조건 충족이 승리를 보장하지는 않습니다.')}</small><div class="row"><button class="primary" ${!chosen.size||s.ended?'disabled':''} onclick="beginBattle()">${T('fight')}</button></div>`}function toggleFighter(id,on){if(on)chosen.add(id);else chosen.delete(id);battlePage()}
function previewBattle(){if(battle)return;let ps=[{id:-1,t:0,job:'healer'},{id:-2,t:1,job:'priest'},{id:-3,t:2,job:'necro'}];show(`<h2>${T('preview')}</h2><canvas class="battlecanvas" id="previewCanvas" width="800" height="340" role="img" aria-label="${B('Three adventurers face eldritch horrors','이형 괴물과 맞서는 세 모험가')}"></canvas><p>${B('Illustrative still. No deployment, costs, rewards, or changes to your game.','예시 스틸입니다. 파견, 비용, 보상, 게임 상태 변화가 없습니다.')}</p><button onclick="closeModal()">${T('close')}</button>`);drawBattle($('previewCanvas').getContext('2d'),2.8,{fighters:ps,win:true,seed:0},true)}
function beginBattle(){if(battle||s.ended)return;let ps=s.people.filter(p=>chosen.has(p.id)&&eligible(p));if(!ps.length)return;let a=ps.reduce((n,p)=>n+effective(p),0),e=enemyStrength();battle={ids:ps.map(p=>p.id),fighters:ps,win:Math.random()*100<cap(50+(a-e)/8,10,95),start:performance.now(),done:false,seed:s.encounters};s.encounters++;ps.forEach(p=>p.foughtDay=s.day);show(`<h2>${B('At the broken boundary','무너진 경계에서')}</h2><canvas class="battlecanvas" id="battleCanvas" width="800" height="340" role="img" aria-label="${B('Battle at the border','변경 교전')}"></canvas><p class="battletext" id="battleText"></p><div id="battleResult"></div><button disabled id="battleClose">${T('continue')}</button>`);requestAnimationFrame(battleFrame)}
function battleFrame(now){if(!battle||battle.done)return;let t=Math.min((now-battle.start)/1000,5.5),c=$('battleCanvas');if(!c)return;drawBattle(c.getContext('2d'),t,battle,false);$('battleText').textContent=t<1.3?B('Boots on ash. Something answers beyond the stones.','재 위로 발소리가 울립니다. 돌 너머에서 무언가 응답합니다.'):t<3.7?B('Steel, prayer, and borrowed magic meet the dark.','강철과 기도, 빌려온 마법이 어둠과 충돌합니다.'):B('One final surge at the boundary.','경계에서 마지막 공세가 부딪칩니다.');if(t>=5.5){resolveBattle();return}requestAnimationFrame(battleFrame)}
function resolveBattle(){if(!battle||battle.done)return;let b=battle;b.done=true;let ps=b.ids.map(id=>s.people.find(p=>p.id===id)).filter(Boolean),g=0,m=0,u=0;if(b.win){g=gain('gold',22+ps.length*10);m=gain('mana',8+ps.length*4);u=gain('sup',6+ps.length*3);s.pressure=cap(s.pressure-12-ps.length*3);s.rep=cap(s.rep+4);ps.forEach(p=>{p.hp=cap(p.hp-(8+Math.floor(Math.random()*12)));p.strain=cap(p.strain+12);p.level++;p.commit=cap(p.commit+6);if(p.job==='healer')p.hp=cap(p.hp+8)});if(ps.some(p=>p.job==='necro'))s.undead+=2;log('A border encounter ends in victory.','변경 교전 승리.')}else{s.pressure=cap(s.pressure+9);s.rep=cap(s.rep-3);ps.forEach(p=>{p.hp=cap(p.hp-(20+Math.floor(Math.random()*16)),1,100);p.strain=cap(p.strain+23)});log('The party retreats, wounded but alive.','일행이 부상당한 채 생존하여 후퇴했습니다.')}ps.forEach(p=>{say(p,'player',b.win?'We held them back. For a moment, it felt possible.':'We had to turn back. Don’t send us out like that again.',b.win?'막아 냈어요. 잠깐은 가능할 것 같았어요.':'돌아설 수밖에 없었어요. 다시는 그렇게 보내지 마세요.');result(p,b.win?'Victory · Level +1 · Returned wounded':'Retreated · Wounded · Rest recommended',b.win?'승리 · 레벨 +1 · 부상 귀환':'후퇴 · 부상 · 휴식 권장')});chosen.clear();$('battleText').textContent=T(b.win?'battleWin':'battleLoss');$('battleResult').innerHTML='<div class="resultbox">'+(b.win?`${g} ${T('gold')} · ${m} ${T('mana')} · ${u} ${T('sup')}<br>${B('Each fighter gained a level.','각 전투원이 레벨을 얻었습니다.')}`:B('Everyone survives. Hostile pressure +9.','모두 생존했습니다. 적대 압력 +9.'))+'</div>';let close=$('battleClose');close.disabled=false;close.onclick=()=>{battle=null;closeModal();render();if(s.pressure>=100)finish(false,'collapse')};render()}
function shopPage(){let cost=50+(s.capacity-3)*30;$('page').innerHTML=`<h2>${T('shop')}</h2><div class="shopgrid"><div class="shopcard"><h3>${T('expand')}</h3><p>${s.people.length} / ${s.capacity} → ${Math.min(s.capacity+1,10)}</p><button ${s.capacity>=10||s.ended?'disabled':''} onclick="buyUpgrade('capacity')">${s.capacity>=10?T('max'):T('buy')+' · '+cost+' '+T('gold')}</button></div>${['gold','mana','sup'].map(k=>`<div class="shopcard"><h3>${T(k)} · ${T('gain')}</h3><p>${T('tier')} ${s.upgrades[k]}/4 · +${s.upgrades[k]*25}%</p><button ${s.upgrades[k]>=4||s.ended?'disabled':''} onclick="buyUpgrade('${k}')">${s.upgrades[k]>=4?T('max'):T('buy')+' · '+(45+35*s.upgrades[k])+' '+T('gold')+' + '+(8+4*s.upgrades[k])+' '+T('mana')}</button></div>`).join('')}</div><p class="muted">${B('Income bonuses apply to positive mission, battle, and voluntary-work gains. Arrivals occur every third day if beds are available.','수입 보너스는 임무, 전투, 자발적 노동의 양의 수입에 적용됩니다. 빈자리가 있으면 3일마다 새 인원이 도착합니다.')}</p><button ${s.people.length>=s.capacity||s.ended?'disabled':''} onclick="invite()">${T('recruit')}</button>`}
function buyUpgrade(k){if(s.ended)return;if(k==='capacity'){if(s.capacity>=10)return;let n=50+(s.capacity-3)*30;if(!spend('gold',n))return;s.capacity++}else{let l=s.upgrades[k];if(l>=4)return;let g=45+35*l,m=8+4*l;if(s.gold<g||s.mana<m){message(T('insufficient'));return}s.gold-=g;s.mana-=m;s.upgrades[k]++}log('An upgrade is entered in the ledger.','확장 내역이 장부에 기록되었습니다.');render()}function invite(){if(s.ended||s.people.length>=s.capacity)return;if(!spend('gold',15))return;let p=addPerson();selected=p.id;tab='reception';logP(p,'Arrives after an invitation.','초대장을 따라 도착했습니다.');say(p,'player','Is there still a place for me?','제 자리가 아직 있나요?');say(p,'you','There is now.','지금은 있습니다.');render()}
const lessons=[['An arrival','도착','Ask about their life.','살아온 이야기를 물어보세요.'],['Questions','질문','Answer their questions. Leave your identity uncertain.','질문에 답하고 정체는 모호하게 남겨 두세요.'],['A first gift','첫 선물','Choose System notification, then open their status in Gifts & provisions.','시스템 알림을 선택한 뒤 선물과 준비에서 상태창을 열어 주세요.'],['A journey','여정','Offer a mission, or advise a class to reach rating 250 for a border fight.','임무를 제안하거나 직업을 상담해 전투력 250으로 변경 교전을 준비하세요.'],['Morning','아침','End the day to resolve assignments and upkeep.','하루를 마감해 임무와 유지비를 처리하세요.'],['The door remains open','열린 문','Shop expands the inn. Organize Fight supports a single Player or a party.','상점에서 여관을 확장하세요. 전투 편성은 한 명 또는 일행을 지원합니다.']];function tutorial(){let e=$('tutorial');if(s.tutorial>5){e.classList.add('hidden');return}e.classList.remove('hidden');let l=lessons[s.tutorial],i=lang==='ko'?1:0;e.innerHTML=`<button onclick="s.tutorial=6;tutorial()">${T(s.tutorial===5?'finish':'skip')}</button><h3>${T('first')} ${Math.min(s.tutorial+1,5)}/5 · ${l[i]}</h3><p>${l[i+2]}</p>`}function toggleLanguage(){if(battle)return;lang=lang==='en'?'ko':'en';try{localStorage.setItem('godInternLanguage',lang)}catch(e){}closeModal();render();if(s.ended)finish(s.outcome,s.reason)}
function ready(p,away=false){if(!p||s.ended||battle)return false;if(p.task&&!away){message(T('away'));return false}return true}function spend(k,n){if(s[k]<n){message(T('insufficient'));return false}s[k]-=n;return true}function suspicious(p,n){p.suspicion=cap(p.suspicion+n);if(p.suspicion>=100){finish(false,'discovery');return true}return false}
function contact(k){let p=current();if(!ready(p))return;channel=k;let a={human:[['You can sit. No one is asking you to kneel.','앉으셔도 됩니다. 무릎을 꿇으라는 사람은 없어요.'],['I didn’t know what the rules were.','어떤 규칙이 있는지 몰랐어요.']],voice:[['You needn’t look for me. I can hear you from here.','저를 찾을 필요는 없어요. 여기서도 들립니다.'],['That doesn’t make it less strange.','그렇다고 덜 이상한 건 아니네요.']],system:[['[A window opens.] One thing at a time.','[창이 열립니다.] 하나씩 알아 가면 됩니다.'],['A window in the air. What else have I missed?','허공에 뜬 창이라. 또 제가 모르는 게 있나요?']]};say(p,k==='system'?'system':'you',...a[k][0]);say(p,'player',...a[k][1]);render()}
const questions=[[['Am I in heaven? Or hell?','천국인가요? 아니면 지옥인가요?'],['Neither name helps much here. This is another world. Tonight, there is an inn. That is enough of a beginning.','그 이름들은 여기서 별 도움이 안 됩니다. 여기는 다른 세계예요. 오늘 밤에는 여관이 있지요. 시작으로는 충분하지 않을까요.']],[['Who are you? A god?','당신은 누구죠? 신인가요?'],['Would a name make it easier? Leave the question unanswered for a while. I’m not going anywhere.','이름을 붙이면 편해지나요? 잠시 답 없이 두셔도 돼요. 저는 어디 안 갑니다.']],[['Can I go back?','돌아갈 수 있나요?'],['There is a way back. It does not promise the morning you remember. We can talk when you’re ready.','돌아가는 길은 있습니다. 기억하시는 아침을 약속하지는 않아요. 준비가 되면 이야기하죠.']]];
function act(a){let p=current();if(!ready(p))return;let costs={window:['mana',4],pocket:['mana',6],bless:['mana',10],equip:['gold',18+12*p.gear],rest:['sup',5]};if((a==='window'&&p.window)||(a==='pocket'&&p.pocket)||(a==='bless'&&p.blessing)||(a==='equip'&&p.gear>=4))return;if(costs[a]&&!spend(...costs[a]))return;let before={trust:p.trust,commit:p.commit,strain:p.strain,hp:p.hp};if(['listen','explain','choice'].includes(a)){if(a==='explain'){let q=questions[p.question++%questions.length];say(p,'player',...q[0]);say(p,channel==='system'?'system':'you',...q[1])}else if(a==='listen'){say(p,'you','What do you remember most clearly? Not the end. Something before it.','가장 선명하게 기억나는 게 뭔가요? 마지막 말고, 그 전의 일로요.');let d={care:['The ringing phone. I was too busy helping someone else to answer.','울리던 전화요. 다른 사람을 돕느라 받지 못했어요.'],freedom:['Everyone telling me what I was. I started believing them.','다들 제가 어떤 사람인지 말했어요. 저도 믿기 시작했고요.'],clarity:['Thinking one more day would let me fix everything.','하루만 더 있으면 전부 고칠 수 있다고 생각했어요.']};say(p,'player',...d[templates[p.t].type]);say(p,'you','We don’t have to turn it into a lesson tonight.','오늘 밤 안에 교훈으로 만들 필요는 없어요.')}else{say(p,'you','Forget what anyone needs from you. What would you choose?','남들이 바라는 건 잊어 보세요. 무엇을 고르고 싶나요?');say(p,'player','A life that feels like mine. Even if I choose badly.','제 것 같은 삶이요. 잘못 고르더라도요.')}if(p.topics[a]===s.day){result(p,'No additional relationship change tonight.','오늘 추가 관계 변화 없음.');render();return}p.topics[a]=s.day;let type=templates[p.t].type;if(a==='listen'){p.trust+=type==='care'?18:10;p.strain-=12;p.commit+=5;p.suspicion=cap(p.suspicion-4)}if(a==='explain'){p.trust+=type==='clarity'?17:8;p.commit+=10;p.suspicion=cap(p.suspicion-10)}if(a==='choice'){p.trust+=type==='freedom'?18:9;p.commit+=9;p.strain-=5}if(channel==='system')p.trust-=4}else{let l={window:['There are things about yourself you haven’t been able to see. Try looking now.','자기 자신에 대해 볼 수 없었던 것들이 있지요. 지금 한번 보세요.'],pocket:['You needn’t carry everything in your hands anymore.','모든 걸 손에 들고 다닐 필요는 없겠네요.'],bless:['The road will still be dangerous. Perhaps less lonely.','길은 여전히 위험하겠지요. 조금 덜 외로울지도요.'],equip:['Something has been set aside for your journey.','여정을 위해 챙겨 둔 게 있어요.'],rest:['Nothing is required tonight. There is food below and a room upstairs.','오늘 밤은 아무것도 하지 않아도 돼요. 아래에는 식사가, 위에는 방이 있어요.']};say(p,channel==='system'?'system':'you',...l[a]);say(p,'player',a==='window'?'My name… my level. It’s really mine?':'Thank you. I’ll see what I can do.',a==='window'?'제 이름… 레벨. 정말 제 건가요?':'고마워요. 제가 할 수 있는 걸 해 볼게요.');if(a==='window'){p.window=true;say(p,'player','And what am I supposed to become here?','그럼 여기서는 무엇이 되어야 하죠?')}if(a==='pocket')p.pocket=true;if(a==='bless')p.blessing=true;if(a==='equip')p.gear++;if(a==='rest'){p.hp=cap(p.hp+35);p.strain-=25}if(channel==='human'&&['window','pocket','bless'].includes(a)){say(p,'player','That was you. Not the window. You did that.','당신이었어요. 창이 아니라. 당신이 한 거죠.');if(suspicious(p,24))return}}
for(let k of ['trust','strain','commit'])p[k]=cap(p[k]);let changes=[['trust','Trust','신뢰'],['commit','Commitment','사명감'],['strain','Strain','피로'],['hp','Health','체력']].filter(([k])=>p[k]!==before[k]);let sums=[0,1].map(i=>changes.map(([k,en,ko])=>(i?ko:en)+' '+(p[k]-before[k]>0?'+':'')+(p[k]-before[k])).join(' · '));if(costs[a]){let [k,n]=costs[a];for(let i=0;i<2;i++)sums[i]+=(sums[i]?' · ':'')+D[k][i]+' −'+n}if(a==='equip'){sums[0]+=' · Equipment tier '+p.gear;sums[1]+=' · 장비 '+p.gear+'단계'}if(!sums[0])sums=['Granted.','적용됨.'];result(p,...sums);logP(p,...sums);if(s.tutorial===0&&a==='listen')s.tutorial=1;else if(s.tutorial===1&&a==='explain')s.tutorial=2;else if(s.tutorial===2&&a==='window')s.tutorial=3;render()}
function assign(i,tone){let p=current();if(!ready(p))return;if(!p.window){message(T('needStatus'));return}if(tone==='bonus'&&!spend('gold',8))return;let q=quests[i],chance=45+p.trust*.35+p.commit*.35-p.strain*.3-templates[p.t].autonomy*.18;say(p,tone==='threat'?'system':'you',tone==='threat'?'[MANDATE] '+q.name[0]+'. Refusal carries a penalty.':'There is a road that needs walking: '+q.name[0]+'. Will you go?',tone==='threat'?'[명령] '+q.name[1]+'. 거부 시 불이익 적용.':'걸어 줄 사람이 필요한 길이 있어요. '+q.name[1]+'. 가 보시겠어요?');if(tone==='bonus')chance+=23;if(tone==='threat'){chance+=30;p.fear=cap(p.fear+22);p.trust=cap(p.trust-16);p.strain=cap(p.strain+12);s.karma=cap(s.karma+4);if(suspicious(p,8))return}if(Math.random()*100>cap(chance,10,95)){p.strain=cap(p.strain+4);say(p,'player','Not yet. I’m not ready to put my life in your hands.','아직은요. 당신에게 삶을 맡길 준비가 안 됐어요.');result(p,'Refused · Strain +4'+(tone==='bonus'?' · 8 gold paid':''),'거절 · 피로 +4'+(tone==='bonus'?' · 8골드 지급됨':''))}else{p.task={q:i,tone};say(p,'player',tone==='threat'?'I’ll go. Don’t call that faith.':'All right. Keep a place for me.',tone==='threat'?'갈게요. 그걸 믿음이라 부르지는 마요.':'좋아요. 제 자리는 남겨 주세요.');result(p,'Accepted · Returns at day’s end','수락 · 하루 마감 시 귀환');if(s.tutorial===3)s.tutorial=4}logP(p,'Assignment discussion: '+q.name[0],q.name[1]+' 임무 논의');tab='reception';render()}
function intervene(kind){let p=current();if(!ready(p,true))return;show('<h2>'+T(kind)+' · '+esc(name(p))+'</h2><p>'+B('Irreversible. A replacement arrives immediately. Returning costs reputation; killing also increases negative karma.','돌이킬 수 없습니다. 대체 인원이 즉시 도착합니다. 송환은 평판을 깎고 처형은 부정적 업보도 높입니다.')+'</p><div class="row"><button class="danger" onclick="executeIntervention(\''+kind+'\','+p.id+')">'+T('confirm')+'</button><button onclick="closeModal()">'+T('cancel')+'</button></div>')}function executeIntervention(kind,id){closeModal();let p=s.people.find(x=>x.id===id);if(!ready(p,true))return;s.people=s.people.filter(x=>x.id!==id);s.rep=cap(s.rep-(kind==='kill'?9:3));if(kind==='kill')s.karma=cap(s.karma+12);logP(p,'Their chapter closes. Another person arrives.','그들의 장이 닫힙니다. 다른 사람이 도착합니다.');selected=addPerson().id;say(current(),'player','Was someone here a moment ago?','방금 전까지 여기 누가 있었나요?');render()}
function endDay(){if(s.ended||battle)return;for(let p of [...s.people]){if(p.task){let q=quests[p.task.q],chance=cap(58+power(p)/14-q.risk+p.commit*.12-p.strain*.2,15,95);if(Math.random()*100<chance){let m=p.pocket?1.2:1;gain('gold',Math.round(q.gold*m));gain('mana',q.mana);gain('sup',q.sup>0?Math.round(q.sup*m):q.sup);s.rep=cap(s.rep+q.rep);s.hr+=q.hr;s.pressure=cap(s.pressure+q.pressure);if(p.task.q===3)s.undead+=2;p.level++;p.commit=cap(p.commit+7);p.trust=cap(p.trust+3);logP(p,'Completed '+q.name[0]+'.',q.name[1]+' 완료.');say(p,'player','I came back. I wasn’t sure I would.','돌아왔어요. 돌아올 수 있을지 몰랐는데.');say(p,'you','Your place is still here.','자리는 그대로 있습니다.');result(p,'Success · Level +1 · Rewards entered','성공 · 레벨 +1 · 보상 반영')}else{p.hp=cap(p.hp-25-q.risk);p.strain=cap(p.strain+18);s.pressure=cap(s.pressure+5);logP(p,'Failed '+q.name[0]+'; wounded.',q.name[1]+' 실패. 부상.');say(p,'player','I thought dying once would make me braver.','한 번 죽었으면 덜 무서울 줄 알았어요.');say(p,'you','No one said you had to stop being afraid. Sit down.','두려워하지 말아야 한다고 한 적은 없어요. 앉으세요.')}p.strain=cap(p.strain+6);p.task=null}else{p.hp=cap(p.hp+8);p.strain=cap(p.strain-5);let risk=cap((templates[p.t].autonomy-p.trust-p.commit*.35+p.fear*.35)/130,0,.6);if(Math.random()<risk){s.pressure=cap(s.pressure+7);s.karma=cap(s.karma+5);s.sup-=6;logP(p,'An unsanctioned expedition angers locals.','독단적인 원정으로 현지인을 자극했습니다.')}else if(p.trust>65){gain('sup',4);logP(p,'Helps restock the inn.','여관 보급을 돕습니다.')}}if(p.fear>55&&p.trust<30){if(suspicious(p,15))return}if(p.hp<=0){s.people=s.people.filter(x=>x.id!==p.id);s.karma=cap(s.karma+5);logP(p,'Dies from injuries. Another arrival follows.','부상으로 사망했습니다. 다른 도착자가 뒤따릅니다.');addPerson()}}let upkeep=Math.ceil(s.hr/3)+s.people.length;s.sup-=upkeep;s.pressure=cap(s.pressure+6+Math.floor(s.karma/18)-Math.floor(might()/650));if(s.sup<0){s.sup=0;s.hr=Math.max(0,s.hr-2);s.rep=cap(s.rep-8);s.pressure=cap(s.pressure+7);log('Two followers leave after supplies run out.','보급이 끊겨 동료 두 명이 떠납니다.')}s.day++;if(s.day%3===0&&s.people.length<s.capacity){let p=addPerson();logP(p,'Arrives at the door.','문 앞에 도착했습니다.');say(p,'player','Is this where I should be?','제가 와야 할 곳이 여기인가요?');say(p,'you','You’re here now. We can begin there.','지금 여기 계시네요. 거기서 시작해 보죠.')}if(!current())selected=s.people[0]?.id;log('Morning. '+upkeep+' supplies used.','아침입니다. 보급품 '+upkeep+' 소모.');if(s.tutorial===4)s.tutorial=5;render();if(s.pressure>=100)finish(false,'collapse');else if(s.day>20)finish(true,'victory')}
function show(html){$('modal').innerHTML=html;$('overlay').classList.remove('hidden')}function closeModal(){if(battle&&!battle.done)return;$('overlay').classList.add('hidden')}function message(t){show('<p>'+t+'</p><button onclick="closeModal()">'+T('close')+'</button>')}function finish(win,reason){s.ended=true;s.outcome=win;s.reason=reason;render();show('<h2>'+T(win?'success':'failure')+'</h2><p>'+T(reason)+'</p><button onclick="closeModal();start()">'+T('newGame')+'</button>')}
function saveGame(){if(battle)return;try{localStorage.setItem('godIntern08',JSON.stringify({s,selected,tab,channel}));$('storage').textContent=T('saved')}catch(e){$('storage').textContent=T('storageError')}}function loadGame(){if(battle)return;try{let raw=localStorage.getItem('godIntern08'),d;if(!raw){raw=localStorage.getItem('godIntern07')}if(!raw){$('storage').textContent=T('noSave');return}d=JSON.parse(raw);s=d.s;selected=d.selected;tab=d.tab;channel=d.channel;chosen.clear();render();if(s.ended)finish(s.outcome,s.reason)}catch(e){$('storage').textContent=T('storageError')}}function contract(){show('<h2>'+T('contract')+'</h2><p>'+T('rule')+'</p><p>'+B('Keep hostile pressure below 100 for twenty days. Only End day advances time. There are no action points. Each conversation topic changes relationships once per person per day.','적대 압력 100 미만으로 20일을 버티세요. 하루 마감만 시간을 진행합니다. 행동력은 없고 같은 대화 주제의 관계 효과는 하루 한 번입니다.')+'</p><p>'+B('Classes are permanent personal choices. Healers recover after victory; a party with a Necromancer gains undead. Income upgrades add 25% per tier to positive earned resources.','직업은 개인이 내리는 영구 선택입니다. 치유사는 승리 후 회복하고 강령술사가 있는 일행은 언데드를 얻습니다. 수입 강화는 단계당 획득 자원을 25% 늘립니다.')+'</p><p>'+B('Test battle threshold: rating 250, equipment tier 0, health 30, and status access. Each person deploys once a day. Battles last 5.5 seconds. The still preview changes no game state.','테스트 전투 기준은 전투력 250, 장비 0단계, 체력 30, 상태창입니다. 하루 한 번 출전하며 연출은 5.5초입니다. 스틸 미리 보기는 게임 상태를 바꾸지 않습니다.')+'</p><p>'+B('Discovery remains internal. Dialogue uses original local bilingual writing, not a live AI service.','정체 발각은 내부적으로 유지됩니다. 대사는 실시간 AI가 아닌 직접 작성한 로컬 한영 문장입니다.')+'</p><button onclick="closeModal()">'+T('close')+'</button>')}

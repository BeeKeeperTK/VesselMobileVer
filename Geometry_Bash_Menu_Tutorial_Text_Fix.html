원에 배정하세요. 포탑은 배정된 차원을 계속 방어하며, 이동 시 3초간 공격을 멈춥니다. 3개 웨이브마다 무기·포탑·코어 보상 중 하나를 무료로 선택합니다. 크레딧은 보상 후보 새로고침에만 사용됩니다. 포탑은 고정 슬롯에 배치되며, 자유 배치나 재화 기반 강화는 없습니다. 3D 화면은 자유 카메라가 아닌 고정 투영 방식입니다.", "Desktop mouse + keyboard recommended. No downloads, libraries, accounts, or network connection required after opening. No story or lore. Best completed wave is saved locally when browser storage permits.": "PC의 마우스와 키보드 사용을 권장합니다. HTML 파일을 열면 추가 다운로드, 외부 라이브러리, 계정 또는 인터넷 연결 없이 실행됩니다. 스토리는 포함하지 않았습니다. 브라우저 저장소를 사용할 수 있으면 최고 클리어 기록이 기기에 저장됩니다.", "Start run": "게임 시작", "Drawing Room": "드로잉 룸", "Pack / Deploy": "보관 / 배치", "Timing click": "타이밍 클릭", "Pause": "일시 정지", "Packing in progress": "보관 준비 중", "Tower deployed": "포탑 배치 완료", "Tower packed · ready in 3s": "포탑 보관 · 3초 후 배치 가능", "needle": "니들 포탑", "pulse": "펄스 포탑", "anchor": "앵커 포탑", "STORED ": "보관 중 ", "E: pack / deploy in ": "E: 보관 / 현재 차원에 배치 ", "Pack it, switch layers, then deploy.": "보관 후 차원을 바꾸고 배치하세요.", "Every 9 cleared waves earns 5 tickets · Open the Drawing Room to customize.": "9개 웨이브 클리어마다 티켓 5장 · 드로잉 룸에서 꾸며 보세요.", "Core skin": "플레이어 코어", "Enemy skin": "적 외형", "Bullet skin": "탄환 외형", "1D weak halo": "1D 약점 표시", "Choose a target before spending a ticket.": "티켓을 사용하기 전에 꾸밀 대상을 선택하세요.", "Begin edit · 1 ticket": "편집 시작 · 티켓 1장", "Save & return": "저장 후 돌아가기", "Close": "닫기", "Reset drawing": "그림 초기화", "Reset this skin": "이 외형 기본값 복원", "Drawing is clipped to the template. Paint with finger or mouse; erase or undo as needed.": "그림은 템플릿 안에만 적용됩니다. 손가락이나 마우스로 그리고 지우기와 실행 취소를 사용할 수 있습니다.", "Erase": "지우기", "Undo": "실행 취소", "Brush": "브러시", "Tickets: ": "티켓: ", "Time left: ": "남은 시간: ", "No tickets yet. Every 9 cleared waves earns 5 tickets.": "티켓이 없습니다. 9개 웨이브를 클리어할 때마다 티켓 5장을 받습니다.", "Each edit costs 1 ticket and lasts 60 seconds. Saving early is allowed.": "편집 1회는 티켓 1장이며 제한 시간은 60초입니다. 미리 저장할 수 있습니다.", "Cosmetics only. Shapes, hitboxes, shields and damage stay unchanged.": "외형만 바뀝니다. 형태, 판정, 보호막, 피해량은 유지됩니다.", "No refunds after editing  three dimensions.": "세 차원을 오가며 조준하고 방어하며 포탑의 특성을 활용하세요.", "Left thumb: aim and fire. Swipe up/down to change layers. Three-wave rewards upgrade turrets; credits fund player technology.": "왼쪽 엄지로 조준과 사격, 위아래 스와이프로 차원 전환. 3웨이브 보상으로 포탑을 강화하고 크레딧으로 플레이어 기술을 연구하세요.", "A short safe training arena appears before the first wave. Learn Auto, Manual, dimension travel and QTE overdrive by playing. Language, cosmetics and Tech Tree are in Menu.": "첫 웨이브 전에 안전한 훈련장에서 자동·수동 사격, 차원 이동, QTE 오버드라이브를 직접 연습합니다. 언어, 꾸미기, 기술 트리는 메뉴에 있습니다.", "Fast shots. 1D affinity: double damage. Pick again to upgrade your Needle tower.": "빠른 연사. 1D 배치 시 피해 2배. 다시 선택하면 니들 포탑이 강화됩니다.", "Area pulses. 2D affinity: double damage. Pick again to upgrade your Pulse tower.": "범위 파동. 2D 배치 시 피해 2배. 다시 선택하면 펄스 포탑이 강화됩니다.", "Heavy long-range shots. 3D affinity: double damage. Pick again to upgrade your Anchor tower.": "강력한 장거리 사격. 3D 배치 시 피해 2배. 다시 선택하면 앵커 포탑이 강화됩니다.", "Menu ☰": "메뉴 ☰", "Menu": "메뉴", "Turrets": "포탑", "AIM / FIRE": "조준 / 사격", "Tech Tree": "기술 트리", "How to play": "게임 방법", "Back to game": "게임으로 돌아가기", "1 · Defend the core": "1 · 코어를 지키세요", "On mobile, hold the LEFT joystick to aim and fire. It gently assists your aim. Auto-fire is optional. On PC, aim with the mouse and hold click or F. The core stays in the center.": "모바일에서는 왼쪽 조이스틱을 밀어 조준과 사격을 합니다. 약한 조준 보정이 적용됩니다. 자동 사격도 선택할 수 있습니다. PC에서는 마우스로 조준하고 클릭 또는 F를 누르세요. 코어는 중앙에 고정되어 있습니다.", "2 · Switch dimensions": "2 · 차원을 전환하세요", "Swipe up/down on the arena or tap 1D / 2D / 3D. New dimensions unlock at waves 4 and 7. Ghost enemies still approach in other layers. 1D dots keep their yellow weak-point windows; 2D/3D enemies have BLUE BARRIERS with openings.": "전장을 위아래로 스와이프하거나 1D / 2D / 3D 버튼을 누르세요. 4, 7웨이브에 새 차원이 열립니다. 다른 차원의 흐릿한 적도 계속 접근합니다. 1D의 노란 약점 표시는 그대로이며, 2D/3D에는 틈이 있는 파란 방벽이 있습니다.", "3 · Match turret affinity": "3 · 포탑과 차원을 맞추세요", "NEEDLE → 1D ×2 damage. PULSE → 2D ×2 damage. ANCHOR → 3D ×2 damage. Like a type advantage, matching the tower to iming bonuses. The training also explains the Menu.": "안전한 훈련부터 시작합니다. 사격, 차원 이동, 타이밍 보너스를 직접 연습하고 메뉴 사용법도 배워 보세요.", "Language and training options are explained as you play.": "언어 변경과 훈련 선택 방법은 진행 중에 안내합니다.", "7 · Menu and saving": "7 · 메뉴와 저장", "After training, Menu pauses the game. Tech Tree spends credits on gun damage or core health; Drawing Room spends tickets on cosmetics. You can also change language, replay training, save, or import and export progress. Save now uses this browser. Download saved HTML creates a separate playable backup; keep and reopen that file to continue. Below, download a backup or choose I understand to finish training.": "훈련 후 메뉴를 열면 게임이 멈춥니다. 기술 트리에서는 크레딧으로 총 피해·코어 체력을 강화하고, 드로잉 룸에서는 티켓으로 외형을 꾸밉니다. 언어 변경, 훈련 다시 보기, 저장과 진행 데이터 가져오기·내보내기도 가능합니다. 지금 저장은 현재 브라우저에 저장합니다. 저장된 게임 다운로드는 별도의 플레이 가능한 파일을 만듭니다. 그 파일을 보관하고 다시 열면 이어 할 수 있습니다. 아래에서 백업을 내려받거나 확인 버튼으로 훈련을 마치세요.", "Save now": "지금 저장", "Download saved HTML": "저장된 게임 다운로드", "Export save data": "저장 데이터 내보내기", "Import save data": "저장 데이터 가져오기", "I understand · continue": "확인 · 계속하기", "Continue saved run": "저장된 게임 이어하기", "Continue in Drawing Room": "드로잉 룸에서 이어하기", "Saved tickets: ": "저장된 티켓: ", "Autosaved in this browser": "이 브라우저에 자동 저장됨", "Browser save unavailable · download saved HTML instead": "브라우저에 저장할 수 없습니다. 저장된 게임 파일을 내려받으세요.", "Download saved HTML for a portable backup. Browser saves can be cleared.": "다른 곳에서도 이어 하려면 저장된 게임 파일을 내려받아 보관하세요. 브라우저 저장 내용은 삭제될 수 있습니다.", "Saved HTML downloaded · keep and reopen that file": "저장된 게임 파일을 내려받았습니다. 보관한 뒤 다시 열어 이어 하세요.", "Save data exported": "저장 데이터를 내보냈습니다.", "Saved in this browser · download a portable backup too": "이 브라우저에 저장했습니다. 백업용 게임 파일도 내려받아 보관하세요.", "Could not read saved progress · use Import save data": "저장된 진행 상황을 읽을 수 없습니다. 저장 데이터 가져오기를 사용하세요.", "Tap a dimension to switch. Hold it to inspect assigned towers.": "차원 버튼을 누르면 이동합니다. 길게 누르면 배치된 포탑을 확인합니다.", "Dots inside each dimension button count its assigned towers. HOLD a dimension button to inspect tower names, levels and affinities; tap a tower there to select it. Needle: 1D ×2, Pulse: 2D ×2, Anchor: 3D ×2. Inspect, pack the Needle, wait 3 seconds, switch to 1D and deploy.": "차원 버튼 안의 점은 배치된 포탑 수입니다. 차원 버튼을 길게 누르면 포탑 이름·레벨·특화 차원을 볼 수 있고, 목록에서 포탑을 누르면 선택됩니다. 니들은 1D, 펄스는 2D, 앵커는 3D에서 피해 2배입니다. 목록에서 니들을 선택해 보관하고, 3초 뒤 1D로 이동해 배치하세요."};
const translationEntries=Object.entries(dictionary).sort((a,b)=>b[0].length-a[0].length);
function tr(t){if(lang!=='ko')return t;if(Object.prototype.hasOwnProperty.call(dictionary,t))return dictionary[t];let out=t;for(let [a,b] of translationEntries){if(out.includes(a))out=out.split(a).join(b)}return out}
let textCache=new WeakMap();
function localize(){document.title=lang==='ko'?'지오메트리 배시':'Geometry Bash';document.documentElement.lang=lang;let walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),n;while(n=walker.nextNode()){if(['SCRIPT','STYLE'].includes(n.parentNode?.tagName))continue;let prev=textCache.get(n),base=prev&&n.nodeValue===prev.out?prev.base:n.nodeValue;let out=tr(base);if(n.nodeValue!==out)n.nodeValue=out;textCache.set(n,{base,out})}document.querySelector('#lang').textContent=lang==='en'?'한국어':'English';document.querySelector('#studioBtn').textContent=tr('Drawing Room')+' · '+tickets;}
function shieldAngle(e){return elapsed*.95+(e.z||0)*2+(e.max||0)*.013}
function isShielded(e,a){let diff=Math.atan2(Math.sin(a-shieldAngle(e)),Math.cos(a-shieldAngle(e)));return Math.abs(diff)>Math.PI/3}
function skinAt(key,x,y,r){let im=skinImages[key];if(!im)return;ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();ctx.drawImage(im,x-r,y-r,r*2,r*2);ctx.restore()}
function draw(){baseDraw();drawBlasts();updateMobileHUD();let o=origin();skinAt('core',o.x,o.y,dim===1?10:dim===3?10:17);for(let e of enemies){if(e.d!==dim)continue;let p=enemyPoint(e);skinAt('enemy',p.x,p.y,e.d===1?e.r*.5:e.d===3?e.r*.42*(p.scale||1):e.r*.8);if(e.d===1&&!autoFire&&weakPoint(e).exposed&&skinImages.weak){ctx.save();ctx.beginPath();ctx.arc(p.x,p.y,e.r*.65+5,0,7);ctx.arc(p.x,p.y,e.r*.65+1,0,7,true);ctx.clip();ctx.drawImage(skinImages.weak,p.x-25,p.y-25,50,50);ctx.restore()}}for(let bullet of shots)if(bullet.d===dim)skinAt('bullet',bullet.x,bullet.y,5);ctx.font='bold 13px system-ui';for(let f of floaters){if(f.d!==dim)continue;ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.color;ctx.fillText(tr(f.text),f.x,f.y)}ctx.globalAlpha=1;

for(let d=1;d<=3;d++){let b=document.querySelector('#d'+d),timer=null,suppressUntil=0;function cancel(){if(timer)clearTimeout(timer);timer=null}b.onpointerdown=e=>{if(d>stage||state!=='playing'||paused)return;cancel();timer=setTimeout(()=>{suppressUntil=performance.now()+800;openRoster(d)},450)};b.onpointerup=cancel;b.onpointercancel=cancel;b.onpointerleave=cancel;b.oncontextmenu=e=>{e.preventDefault();suppressUntil=performance.now()+800;openRoster(d)};b.onclick=e=>{cancel();if(performance.now()<suppressUntil){e.preventDefault();return}closeRoster();switchDim(d)}}
function makeRunSnapshot(){let r=trainingActive?trainingSnap:null;if(postDeathStudio)return null;if(!r&&state!=='playing'&&state!=='reward')return null;if(!r)r={wave,stage,dim,hp,maxHp,cash,kills,enemies,shots,towers,spawnLeft,spawnTimer,gap,elapsed,shotTimer,rewardChoices,rewardAt,state,gun,autoFire,qte,qteWait,boost,qteHits,qteAttempts,selectedTower,techLevels,clearedWaves};return {wave:r.wave,stage:r.stage,dim:r.dim,hp:r.hp,maxHp:r.maxHp,cash:r.cash,kills:r.kills,spawnLeft:r.spawnLeft,spawnTimer:r.spawnTimer,gap:r.gap,elapsed:r.elapsed,shotTimer:r.shotTimer,gun:{...r.gun},towers:r.towers.map(t=>({...t})),enemies:r.enemies.map(e=>({...e})),shots:r.shots.map(s=>({...s,hit:[...s.hit].map(e=>r.enemies.indexOf(e)).filter(i=>i>=0)})),rewardChoices:r.rewardChoices.map(c=>({type:c.type,steps:c.steps||1})),rewardAt:r.rewardAt,state:r.state==='reward'?'reward':'playing',autoFire:r.autoFire,qte:r.qte?{...r.qte}:null,qteWait:r.qteWait,boost:r.boost,qteHits:r.qteHits,qteAttempts:r.qteAttempts,selectedTower:r.selectedTower,techLevels:{...r.techLevels},clearedWaves:r.clearedWaves}}

function saveCheckpoint(){let record=makeSaveRecord();pendingSave=record;try{localStorage.setItem(SAVE_KEY,JSON.stringify(record));lastSaveAt=record.savedAt;storageOK=true;saveMessage='Autosaved in this browser'}catch(e){storageOK=false;saveMessage='Browser save unavailable · download saved HTML instead'}updateSaveInfo();return record}

function validateSave(data){if(!data||data.format!=='geometry-bash-save'||data.version!==1||!data.profile)throw Error('Not a Geometry Bash save');let nodes=0;function scan(v,depth=0){if(depth>25||++nodes>300000)throw Error('Save too large');if(typeof v==='number'&&!Number.isFinite(v))throw Error('Invalid number');if(typeof v==='string'&&v.length>2000000)throw Error('Save too large');if(v&&typeof v==='object')for(let k of Object.keys(v)){if(['__proto__','prototype','constructor'].includes(k))throw Error('Invalid field');scan(v[k],depth+1)}}scan(data);let p=data.profile;if(!Number.isInteger(p.tickets)||p.tickets<0||!['en','ko'].includes(p.lang))throw Error('Invalid profile');for(let [key,val] of Object.entries(p.skins||{}))if(!['core','enemy','bullet','weak'].includes(key)||typeof val!=='string'||!val.startsWith('data:image/png;base64,'))throw Error('Invalid skin');let r=data.run;if(r){if(!Number.isInteger(r.wave)||r.wave<1||!['playing','reward'].includes(r.state)||r.hp<=0||r.maxHp<r.hp||r.cash<0||!r.gun||r.gun.damage<=0||r.gun.rate<=0)throw Error('Invalid run');if(!Array.isArray(r.enemies)||r.enemies.length>15000||!Array.isArray(r.shots)||r.shots.length>20000||!Array.isArray(r.towers)||r.towers.length>3)throw Error('Invalid entities');for(let e of r.enemies)if(![1,2,3].includes(e.d)||!['normal','runner','tank'].includes(e.type)||e.r<=0||e.hp<0)throw Error('Invalid enemy');for(let t of r.towers)if(!['needle','pulse','anchor'].includes(t.type)||![1,2,3].includes(t.d)||!Number.isInteger(t.level)||t.level<1)throw Error('Invalid tower');for(let c of r.rewardChoices||[])if(!['needle','pulse','anchor'].includes(c.type)||![1,2].includes(c.steps))throw Error('Invalid reward')}return data}
function restoreRecord(data){data=validateSave(data);if(trainingActive)finishTutorial();postDeathStudio=false;studioOpen=false;studioEdit=false;box.style.display='none';closeRoster();if(menuIsOpen)closeMenu();if(techOpen)closeTech();let p=data.profile;saveSlotId=data.id||'';tickets=p.tickets;skins=p.skins||{};skinImages={};loadSkins();lang=p.lang;tutorialSeen=!!p.tutorialSeen;best=Math.max(0,p.best||0);pendingSave=data;if(data.deathRoom){state='end';postDeathStudio=true;closePanel();openStudio();saveProfile();saveCheckpoint();return}if(!data.run){state='menu';closePanel();renderLaunch();saveProfile();saveCheckpoint();return}let r=data.run;startBase();wave=r.wave;stage=Math.min(3,Math.ceil(wave/3));dim=clamp(r.dim||1,1,stage);hp=r.hp;maxHp=r.maxHp;cash=r.cash;kills=r.kills||0;spawnLeft=r.spawnLeft;spawnTimer=r.spawnTimer;gap=r.gap||0;elapsed=r.elapsed||0;shotTimer=r.shotTimer||0;gun={...r.gun};towers=r.towers.map(t=>({...t}));enemies=r.enemies.map(e=>({...e}));shots=r.shots.map(s=>({...s,hit:new Set((s.hit||[]).map(i=>enemies[i]).filter(Boolean))}));rewardChoices=(r.rewardChoices||[]).map(c=>{let base=rewards.find(b=>b.type===c.type),steps=c.steps||1;return {...base,steps,displayName:base.name+' · +'+steps,apply:()=>{for(let n=0;n<steps;n++)addTower(base.type)}}});rewardAt=r.rewardAt||0;autoFire=!!r.autoFire;qte=r.qte;boost=r.boost||0;qteWait=r.qteWait??2;qteHits=r.qteHits||0;qteAttempts=r.qteAttempts||0;selectedTower=clamp(r.selectedTower??-1,-1,towers.length-1);techLevels=r.techLevels||{damage:0,health:0};clearedWaves=r.clearedWaves||wave-1;state=r.state;paused=false;mouse.down=false;joy.active=false;joy.power=0;keys={};particles=[];floaters=[];blastRings=[];document.querySelector('#auto').textContent='Mode: '+(autoFire?'AUTO':'MANUAL');if(state==='reward')showRewards();else closePanel();saveProfile();saveCheckpoint();localize()}

try{let embedded=document.querySelector('#gbEmbeddedSave');let local=localStorage.getItem(SAVE_KEY);let candidates=[];if(embedded)candidates.push(validateSave(JSON.parse(embedded.textContent)));if(local){try{let d=validateSave(JSON.parse(local));if(!candidates.length||d.id===candidates[0].id)candidates.push(d)}catch(e){}}pendingSave=candidates.sort((a,b)=>b.savedAt-a.savedAt)[0]||null;if(pendingSave){let p=pendingSave.profile;saveSlotId=pendingSave.id;tickets=p.tickets;skins=p.skins||{};skinImages={};loadSkins();lang=p.lang;tutorialSeen=!!p.tutorialSeen;best=Math.max(best,p.best||0)}}catch(e){saveMessage='Could not read saved progress · use Import save data';}

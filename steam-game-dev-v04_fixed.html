<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steam Game Dev v0.4 — repaired</title>
<style>
:root{--bg:#101a25;--panel:#172737;--panel2:#20384b;--ink:#eaf3f8;--muted:#aabecd;--line:rgba(202,228,243,.18);--blue:#7ec5ef;--green:#b9d981;--gold:#f0c770;--red:#ef9691;--shadow:0 16px 34px rgba(0,0,0,.28)}[data-theme=light]{--bg:#e8f0f5;--panel:#fff;--panel2:#e0edf5;--ink:#182938;--muted:#547084;--line:rgba(28,60,80,.18);--blue:#126c9f;--green:#527a29;--gold:#9a6912;--red:#a74342;--shadow:0 12px 25px rgba(24,52,72,.14)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 88% 0,rgba(60,135,180,.26),transparent 32%),var(--bg);color:var(--ink);font:16px/1.5 Satoshi,sans-serif}.shell{max-width:1320px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.mark{width:34px;height:34px;border:2px solid var(--blue);border-radius:7px;position:relative}.mark:after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:var(--green);right:-5px;bottom:-5px}.brand b,h1,h2{font-family:'Clash Display',sans-serif}.brand b{font-size:20px}.brand small{display:block;color:var(--muted);font-size:12px}.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.chip,button{font:600 13px Satoshi,sans-serif}.chip{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:8px 10px}.cash{color:var(--green)}.warning{color:var(--gold)}button{min-height:38px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);padding:8px 11px;cursor:pointer;transition:.16s}button:hover:not(:disabled),button.selected{border-color:var(--blue);background:color-mix(in srgb,var(--panel2) 75%,var(--blue))}button:disabled{opacity:.42;cursor:not-allowed}.steps{display:flex;gap:6px;overflow:auto;padding:17px 0 10px}.step{min-width:138px;flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:rgba(0,0,0,.08);color:var(--muted);font-size:13px}.step.active{border-color:var(--blue);background:var(--panel2);color:var(--ink)}.step.done{color:var(--green)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px}.card{background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel) 73%,#09141c));border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.stage{padding:22px;min-height:635px;position:relative;overflow:hidden}.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);font-weight:700}.stage h1{font-size:clamp(27px,3vw,42px);line-height:1.12;margin:9px 0}.stage>p{color:var(--muted);max-width:720px;margin:0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}.choice{text-align:left;min-height:94px;padding:13px}.choice b{display:block;font-size:16px}.choice span{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:4px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.primary{background:var(--blue);color:#102839;border-color:transparent}.danger{background:var(--red);border-color:transparent;color:#311416}.note{margin-top:18px;padding:11px 13px;border-left:3px solid var(--gold);background:rgba(235,191,103,.09);color:var(--muted);font-size:13px}.side{display:grid;gap:16px;align-content:start}.panel-hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.live{color:var(--green);font-size:11px;font-weight:700}.game-wrap{background:#0d1821}.game-wrap canvas{display:block;width:100%;height:292px;image-rendering:pixelated}.help{padding:10px 14px;color:var(--muted);font-size:12px}.team{padding:12px;display:grid;gap:9px}.employee{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px}.employee canvas{width:54px;height:54px;border:1px solid var(--line);border-radius:7px;background:#102230}.employee b{display:block;font-size:13px}.employee span{display:block;font-size:11px;color:var(--muted)}.employee em{font-style:normal;color:var(--gold);font-size:11px}.archive{padding:12px}.archive summary{cursor:pointer;color:var(--muted);font-size:13px}.archive-row{font-size:12px;padding:8px;margin-top:8px;border:1px solid var(--line);border-radius:7px}.overlay{position:absolute;inset:0;background:rgba(13,25,35,.98);z-index:5;padding:26px;display:none}.overlay.show{display:block;overflow:auto}.overlay.show~#content{visibility:hidden}#stage:has(.overlay.show){min-height:540px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.metric{padding:10px;border:1px solid var(--line);border-radius:8px}.metric b{font-size:20px;color:var(--green);display:block}.metric span{font-size:11px;color:var(--muted)}.smallgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.smallgrid button{min-height:80px;text-align:left}.bad{color:var(--red)}@media(max-width:900px){.layout{grid-template-columns:1fr}.stage{min-height:auto}.game-wrap canvas{height:260px}}@media(max-width:560px){.shell{padding:12px}.top{align-items:flex-start}.brand small{display:none}.choices{grid-template-columns:1fr}.smallgrid{grid-template-columns:1fr}.hud{gap:4px}.chip{padding:7px}.stage{padding:17px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><i class="mark"></i><div><b>FIRST RELEASE</b><small>Steam developer survival simulator · v0.4 repaired</small></div></div><div class="hud"><span class="chip cash" id="cash"></span><span class="chip" id="date"></span><span class="chip warning" id="due"></span><button id="theme" aria-label="toggle theme">☾</button></div></header><nav class="steps" id="steps"></nav><section class="layout"><section class="card stage" id="stage"><div class="overlay" id="overlay"></div><div id="content"></div></section><aside class="side"><section class="card"><div class="panel-hd"><b>Playable build</b><div><span class="live" id="live">LIVE</span> <button id="reset-prototype">Reset prototype</button></div></div><div class="game-wrap"><canvas id="game" width="760" height="540"></canvas></div><div class="help" id="help">Choose a pitch. The prototype will change completely with its genre.</div></section><section class="card"><div class="panel-hd"><b>Your studio team</b><span class="live">OPTIONAL STAFF</span></div><div class="team" id="team"></div></section><details class="card archive"><summary>Studio log</summary><div id="archive"></div></details></aside></section></main><script>
const $=id=>document.getElementById(id);let phase=0,genre=null,engine=null,day=1,cash=100,week=1,archive=[],employees={design:false,art:false,code:false},ai={design:false,art:false,code:false},released=false,keys={},player={},frameCount=0,theme='dark',closed=false,project={registered:false,page:false,settled:false,net:0,work:0,tests:0},lastTick=0;
const phases=['Pitch','Engine','Production','Launch','Results'];const genres=[
{id:'shop',name:'Cozy management',desc:'Operate a tiny neighborhood shop: find and serve three waiting customers.',controls:'WASD / arrows to move · E to interact',goal:'Serve all 3 customers.'},
{id:'platform',name:'Precision platformer',desc:'Build a compact, difficult movement challenge with a restartable course.',controls:'A/D or arrows to run · W/Up/Space to jump',goal:'Reach the green finish flag.'},
{id:'mystery',name:'Narrative mystery',desc:'Investigate a grounded incident by inspecting evidence.',controls:'WASD / arrows to walk · E to inspect',goal:'Inspect the three evidence markers.'},
{id:'warehouse',name:'Warehouse puzzle',desc:'Route freight through a tight warehouse without jamming the floor.',controls:'Arrows to move · push crates onto green pads',goal:'Place both crates on loading pads.'}
];
const teamInfo={design:['Game design','Morgan · Systems designer',42,'#7ec5ef'],art:['Art','Jae · Contract artist',38,'#f0c770'],code:['Programming','Nora · Gameplay programmer',48,'#b9d981']};
function money(n){return (n<0?'−':'')+'$'+Math.abs(Math.round(Number(n))).toLocaleString()}function selected(g){return genre&&genre.id===g.id?' selected':''}
function weeklyCost(){return 59+Object.keys(employees).reduce((n,k)=>n+(employees[k]?teamInfo[k][2]:ai[k]?8:0),0)}
function advance(days,reason){if(closed)return false;archive.unshift(`Day ${day}: ${reason}`);for(let i=0;i<days;i++){day++;if(day>week*7){week++;bills()}if(closed)break}renderHud();renderTeam();renderArchive();return !closed}
function bills(){let total=weeklyCost();cash-=total;archive.unshift(`Day ${day}: Weekly bills paid: ${money(total)} (rent $45 + utilities $14 + active staff/AI).`);if(cash<0)gameOver()}
function gameOver(){closed=true;keys={};let o=$('overlay');o.innerHTML=`<div class="eyebrow">Studio closed · day ${day}</div><h2>Cash ran out before the bills did.</h2><p>You could not cover rent, utilities, payroll, and subscriptions. This is a game-over state—not a rewindable publishing checklist.</p><div class="metrics"><div class="metric"><b>${money(cash)}</b><span>Final cash</span></div><div class="metric"><b>${week}</b><span>Weeks survived</span></div><div class="metric"><b>${archive.filter(x=>x.includes('Launch')).length}</b><span>Games launched</span></div></div><button class="primary" id="restart">Start a new studio</button>`;o.classList.add('show');document.querySelectorAll('#content button').forEach(b=>b.disabled=true);$('restart').onclick=()=>location.reload()}
function renderHud(){$('cash').textContent=money(cash)+' cash';$('date').textContent='Day '+day+' · Week '+week;$('due').textContent=money(weeklyCost())+' due in '+(week*7+1-day)+' days';}
function renderSteps(){$('steps').innerHTML=phases.map((x,i)=>`<div class="step ${i===phase?'active':''} ${i<phase?'done':''}">${i<phase?'✓ ':''}${i+1}. ${x}</div>`).join('')}
function renderTeam(){let e=$('team');e.innerHTML=Object.entries(teamInfo).map(([k,v],i)=>{let [role,name,cost,color]=v;let active=employees[k]?'Hired':ai[k]?'AI assisted':'Unassigned';let costText=employees[k]?money(cost)+'/week':ai[k]?money(8)+'/week token plan':'Solo';return `<div class="employee"><canvas id="face-${k}" width="54" height="54"></canvas><div><b>${role}</b><span>${employees[k]?name:ai[k]?'AI copilot subscription':'You handle this yourself'}</span></div><em>${active}<br>${costText}</em></div>`}).join('');Object.entries(teamInfo).forEach(([k,v],i)=>drawFace($('face-'+k),i,v[3],employees[k],ai[k]))}
function drawFace(c,i,col,hired,bot){let x=c.getContext('2d');x.fillStyle='#102433';x.fillRect(0,0,54,54);x.strokeStyle=col;x.lineWidth=2;x.beginPath();x.arc(27,18,9,0,7);x.stroke();x.beginPath();x.moveTo(12,48);x.quadraticCurveTo(16,31,27,30);x.quadraticCurveTo(38,31,42,48);x.stroke();if(hired){x.fillStyle=col;x.fillRect(23,15,3,3);x.fillRect(29,15,3,3)}if(bot){x.strokeRect(17,12,20,16);x.fillRect(20,17,3,3);x.fillRect(29,17,3,3)}}
function render(){renderArchive();renderSteps();renderHud();renderTeam();let c=$('content');if(phase===0)renderPitch(c);if(phase===1)renderEngine(c);if(phase===2)renderProduction(c);if(phase===3)renderLaunch(c);if(phase===4)renderResults(c);drawGame()}
function frame(title,desc,body,back,next){$('content').innerHTML=`<div class="eyebrow">${phases[phase]} · ${phase+1}/5</div><h1>${title}</h1><p>${desc}</p>${body}<div class="actions"><button id="back" ${back&&phase===1?'':'disabled'}>Back</button><button class="primary" id="next">${next}</button></div>`;$('back').onclick=()=>{if(!closed&&phase===1){phase=0;render()}}}
function renderPitch(c){let cards=genres.map(g=>`<button class="choice${selected(g)}" data-g="${g.id}"><b>${g.name}</b><span>${g.desc}</span></button>`).join('');frame('Pitch a game people can understand.','Your choice defines the actual playable build—not just its color palette.',`<div class="choices">${cards}</div><div class="note">Keep the first game small. You have ${money(cash)} and bills begin at the end of week one.</div>`,false,'Choose engine');document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{genre=genres.find(g=>g.id===b.dataset.g);resetGame();render()});$('next').disabled=!genre;$('next').onclick=()=>{if(!advance(2,'Pitch approved: '+genre.name))return;phase=1;render()};$('help').textContent=genre?genre.controls+' · Goal: '+genre.goal:'Choose a genre to load its unique prototype.'}
function renderEngine(){let engines=[['Godot','Free, lean 2D workflow.','0','3'],['Unity','Familiar 2D production.','0','2'],['RPG Maker MZ','Fast dialogue-first tools.','20','1'],['Unreal Engine','Heavy but powerful.','0','4']];let body=`<div class="choices">${engines.map((a,i)=>`<button class="choice${engine===i?' selected':''}" data-e="${i}"><b>${a[0]}</b><span>${a[1]} License now: ${money(a[2])} · Learning: ${a[3]} days</span></button>`).join('')}</div><div class="note">Engine learning consumes calendar time. Engine choice changes setup cost and learning time; it does not change the prototype physics.</div>`;frame('Pick an engine path.','The engine is a production decision, not the game itself.',body,true,'Enter production');document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{engine=+b.dataset.e;render()});$('next').disabled=engine===null;$('next').onclick=()=>{let costs=[0,0,20,0],learn=[3,2,1,4];if(cash<costs[engine])return;cash-=costs[engine];if(!advance(learn[engine],engines[engine][0]+' setup and learning'))return;phase=2;render()}}
function renderProduction(){let staffCards=Object.entries(teamInfo).map(([k,v])=>`<button class="choice" data-staff="${k}"><b>${v[0]} — ${employees[k]?'Hired':ai[k]?'AI plan active':'Assign work'}</b><span>Hire ${v[1]}: ${money(v[2])}/week; or use AI support: ${money(8)}/week. Click to cycle Solo → AI → Hire.</span></button>`).join('');let body=`<div class="smallgrid"><button id="build"><b>Implement build</b><br><span>Advance 2 days; improve readiness.</span></button><button id="playtest"><b>Run playtest</b><br><span>Optional. Costs ${money(12)} and 1 day.</span></button><button id="polish"><b>Polish core loop</b><br><span>Advance 2 days; improve simulated release quality.</span></button></div><button id="production-contract" style="margin-top:12px">Contract work: +$55 / 3 days</button><div class="choices">${staffCards}</div><div class="note" id="prodnote">${genre.name} prototype is active. Play it in the panel: ${genre.goal} Testing is optional; it is not a mandatory phase.</div>`;frame('Make decisions under a real clock.','Every production action advances time. Recurring rent, power, payroll, and AI subscriptions will arrive whether your build is ready or not.',body,true,'Lock build for launch');$('production-contract').onclick=()=>{if(closed)return;cash+=55;if(advance(3,'Emergency contract work completed'))render()};$('build').onclick=()=>{if(!advance(2,'Implemented '+genre.name+' build'))return;project.work++;$('prodnote').textContent='Build iteration complete. Play it again, revise staffing, or launch before the runway disappears.'};$('playtest').onclick=()=>{if(cash>=12){cash-=12;if(!advance(1,'Optional genre-specific playtest: '+playtestText()))return;project.tests++;$('prodnote').textContent=playtestText()}};$('polish').onclick=()=>{if(!advance(2,'Polished the core loop'))return;project.work++;$('prodnote').textContent='Core loop polish recorded. More time can improve quality, but it also brings bills.'};document.querySelectorAll('[data-staff]').forEach(b=>b.onclick=()=>{let k=b.dataset.staff;if(!ai[k]&&!employees[k])ai[k]=true;else if(ai[k]){ai[k]=false;employees[k]=true}else employees[k]=false;renderTeam();render()});$('next').onclick=()=>{if(!advance(1,'Build locked for launch'))return;phase=3;render()}}
function playtestText(){return {shop:'Players enjoy the short shop loop, but two missed the restock prompt.',platform:'Players understand the objective; several request clearer landing targets before the final jump.',mystery:'Players follow the investigation, but want stronger evidence highlights.',warehouse:'Players like crate routing, but the second delivery pad needs a clearer visual signal.'}[genre.id]}
function renderLaunch(){let body=`<div class="choices"><button class="choice" id="direct" ${project.registered?'disabled':''}><b>${project.registered?'Steam app registered':'Register Steam app'}</b><span>Simulated product fee: $100. Pay once per project.</span></button><button class="choice" id="page" ${project.page?'disabled':''}><b>${project.page?'Store page ready':'Prepare store presence'}</b><span>One day. Optional marketing preparation.</span></button><button class="choice" id="launch" ${project.registered?'':'disabled'}><b>Launch now</b><span>Requires registration. This simplified simulation does not model Steam review or waiting periods.</span></button><button class="choice" id="contract"><b>Take emergency contract work</b><span>Earn $55 before spending 3 days. Weekly bills still apply.</span></button></div><div class="note" id="launchnote">Register this project once, then launch when ready. Store materials are optional.</div>`;frame('Commit to the market.','Publishing spends real studio cash. Each project tracks its own fee and marketing.',body,false,'Launch project');$('next').disabled=!project.registered;$('direct').disabled=project.registered||cash<100;$('direct').onclick=()=>{if(closed||project.registered||cash<100)return;cash-=100;project.registered=true;if(advance(1,'Steam app registered (simulated product fee)'))render()};$('page').onclick=()=>{if(closed||project.page)return;project.page=true;if(advance(1,'Store page prepared'))render()};$('contract').onclick=()=>{if(closed)return;cash+=55;if(advance(3,'Emergency contract work completed'))render()};$('launch').onclick=doLaunch;$('next').onclick=doLaunch}
function doLaunch(){if(closed||released||!project.registered)return;if(!advance(1,'Launch: '+genre.name))return;released=true;let staff=Object.values(employees).filter(Boolean).length,aiCount=Object.values(ai).filter(Boolean).length,base=[145,170,120,155][genres.indexOf(genre)];project.gross=Math.max(45,base+project.work*55+staff*28+(project.page?50:0)+project.tests*10-aiCount*8);project.fee=project.gross*.30;project.net=project.gross-project.fee;cash+=project.net;project.settled=true;archive.unshift('Release settled: '+genre.name+' · net '+money(project.net));phase=4;render()}
function renderResults(){let body=`<div class="metrics"><div class="metric"><b>${money(project.gross)}</b><span>Gross revenue</span></div><div class="metric"><b>${money(project.fee)}</b><span>Simulated platform fee</span></div><div class="metric"><b>${money(project.net)}</b><span>Net credited once</span></div></div><div class="note">This release is archived. Staff and subscriptions carry over, but each new game needs its own registration. Cash remains ${money(cash)}.</div>`;frame('Release results are in.','Revenue is a simplified simulation, not a forecast. Reopening or redrawing this screen never pays twice.',body,false,'Begin next project');$('next').onclick=()=>{if(closed)return;archive.unshift('Project archived: '+genre.name+' · net '+money(project.net));genre=null;engine=null;released=false;project={registered:false,page:false,settled:false,net:0,work:0,tests:0};phase=0;resetGame();if(advance(1,'New project planning begins'))render()}}
function resetGame(){keys={};player={x:60,y:420,vx:0,vy:0,served:0,clues:[],won:false,crates:[{x:3,y:3},{x:4,y:5}],gx:1,gy:4};$('live').textContent='LIVE';if(genre)$('help').textContent=genre.controls+' · Goal: '+genre.goal+' · R to reset';}
function completeBuild(message){if(player.won)return;player.won=true;$('live').textContent='COMPLETE';$('help').textContent=message+' · Press R or Reset prototype to replay.';archive.unshift('Playable build completed: '+genre.name);renderArchive()}
function drawGame(){let c=$('game'),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);if(!genre){x.fillStyle='#0e1d29';x.fillRect(0,0,w,h);x.fillStyle='#9fb9ca';x.font='20px Satoshi';x.fillText('Pitch a genre to load its playable build.',42,70);return}if(genre.id==='shop')drawShop(x,w,h);if(genre.id==='platform')drawPlatform(x,w,h);if(genre.id==='mystery')drawMystery(x,w,h);if(genre.id==='warehouse')drawWarehouse(x,w,h)}
function hero(x,col='#f0c770'){x.fillStyle=col;x.fillRect(player.x,player.y,22,28);x.fillStyle='#172534';x.fillRect(player.x+4,player.y-9,14,13)}function label(x,s){x.fillStyle='#eef5fa';x.font='bold 16px Satoshi';x.fillText(s,18,29)}
function drawShop(x,w,h){x.fillStyle='#4b6d68';x.fillRect(0,0,w,h);x.fillStyle='#b28b57';x.fillRect(0,390,w,150);for(let i=0;i<4;i++){x.fillStyle='#e6ce91';x.fillRect(120+i*150,120,80,110);x.fillStyle='#6b4833';x.fillRect(125+i*150,125,70,8)};let cus=[[620,160],[650,265],[600,350]];cus.forEach((p,i)=>{x.fillStyle=player.served>i?'#8aa58b':'#d88d86';x.fillRect(p[0],p[1],25,36)});x.fillStyle='#b9d981';x.fillRect(52,210,55,70);hero(x);label(x,'COZY SHOP · served '+player.served+'/3');}
function drawPlatform(x,w,h){x.fillStyle='#263b60';x.fillRect(0,0,w,h);let p=[[0,480,150,60],[230,410,120,20],[430,325,120,20],[620,240,140,20]];x.fillStyle='#91bad2';p.forEach(q=>x.fillRect(...q));x.fillStyle='#b9d981';x.fillRect(710,170,14,70);x.fillStyle='#f0c770';x.fillRect(695,170,15,11);hero(x);label(x,'PRECISION PLATFORMER · reach the flag');}
function drawMystery(x,w,h){x.fillStyle='#464b57';x.fillRect(0,0,w,h);x.fillStyle='#70808b';x.fillRect(50,80,250,150);x.fillRect(440,95,260,130);x.fillStyle='#2e343d';x.fillRect(0,390,w,150);let clues=[[180,300],[430,315],[650,270]];clues.forEach((p,i)=>{x.fillStyle=player.clues.includes(i)?'#74968f':'#f0c770';x.fillRect(p[0],p[1],18,18)});hero(x,'#7ec5ef');label(x,'NARRATIVE MYSTERY · clues '+player.clues.length+'/3');}
function drawWarehouse(x,w,h){x.fillStyle='#3a3026';x.fillRect(0,0,w,h);for(let gy=0;gy<8;gy++)for(let gx=0;gx<11;gx++){x.fillStyle=gx===0||gx===10||gy===0||gy===7?'#65717a':'#735e43';x.fillRect(50+gx*60,30+gy*60,58,58)}[[8,2],[8,5]].forEach(([gx,gy])=>{x.fillStyle='#b9d981';x.fillRect(55+gx*60,35+gy*60,48,48)});player.crates.forEach(q=>{x.fillStyle='#d59a54';x.fillRect(57+q.x*60,37+q.y*60,44,44)});x.fillStyle='#7ec5ef';x.fillRect(68+player.gx*60,42+player.gy*60,25,34);label(x,'WAREHOUSE · push both crates onto green pads · R resets')}
function warehouseMove(dx,dy){if(player.won||closed)return;let nx=player.gx+dx,ny=player.gy+dy;if(nx<1||nx>9||ny<1||ny>6)return;let crate=player.crates.find(q=>q.x===nx&&q.y===ny);if(crate){let cx=nx+dx,cy=ny+dy;if(cx<1||cx>9||cy<1||cy>6||player.crates.some(q=>q.x===cx&&q.y===cy))return;crate.x=cx;crate.y=cy}player.gx=nx;player.gy=ny;if([[8,2],[8,5]].every(([x,y])=>player.crates.some(q=>q.x===x&&q.y===y)))completeBuild('Both deliveries loaded!')}

function tick(now){if(!lastTick)lastTick=now;let elapsed=Math.min(100,now-lastTick);let steps=Math.floor(elapsed/(1000/60));for(let i=0;i<steps;i++)updateGame();lastTick+=steps*(1000/60);drawGame();requestAnimationFrame(tick)}

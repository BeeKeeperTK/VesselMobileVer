<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>VOXEL RAID // 0.7x-3D — Milestone Choices</title>
    <style>
        :root {
            --bg: #09111e;
            --panel: #111d30;
            --line: #30465f;
            --ink: #edf6ff;
            --muted: #94abc5;
            --mint: #73f5be;
            --gold: #ffcf71;
            --cyan: #74cfff
        }

        * {
            box-sizing: border-box
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font: 14px system-ui,-apple-system,Segoe UI,sans-serif;
            touch-action: none;
            user-select: none
        }

        button, input, select {
            font: inherit
        }

        button {
            background: #21344f;
            border: 1px solid #47627e;
            color: var(--ink);
            border-radius: 9px;
            padding: 10px 14px;
            cursor: pointer;
            touch-action: manipulation
        }

            button:hover {
                background: #304b6d
            }

            button:disabled {
                opacity: .4;
                cursor: default
            }

        .primary {
            background: #256454;
            border-color: #73f5be
        }

        .danger {
            border-color: #e88282;
            color: #ffbcbc
        }

        .small {
            font-size: 12px;
            padding: 6px 9px
        }

        canvas#world {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block
        }

        #hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            display: none
        }

            #hud button {
                pointer-events: auto
            }

        .glass {
            background: linear-gradient(135deg,#101c2ef2,#101c2edb);
            border: 1px solid #3a526c;
            border-radius: 12px;
            box-shadow: 0 8px 25px #0004
        }

        .topLeft {
            position: absolute;
            top: max(12px,env(safe-area-inset-top));
            left: 12px;
            width: min(330px,46vw);
            padding: 12px
        }

        .eyebrow {
            letter-spacing: 2px;
            font-size: 10px;
            color: var(--mint);
            text-transform: uppercase
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 9px
        }

        .bar {
            height: 9px;
            background: #07101c;
            border-radius: 6px;
            overflow: hidden
        }

            .bar > i {
                height: 100%;
                display: block;
                transition: width .15s;
                border-radius: 6px
            }

        .tally {
            margin-top: 8px;
            font-size: 11px
        }

            .tally .row {
                margin-bottom: 4px
            }

        .vitals {
            margin: 8px 0;
            display: grid;
            gap: 5px
        }

        .topRight {
            position: absolute;
            right: 12px;
            top: max(12px,env(safe-area-inset-top));
            width: 205px;
            text-align: right
        }

            .topRight .row {
                justify-content: flex-end;
                margin-bottom: 7px
            }

        #map {
            width: 205px;
            height: 110px;
            background: #102033d9;
            border: 1px solid #40536b;
            border-radius: 9px;
            pointer-events: auto;
            touch-action: none
        }

        #passives {
            position: absolute;
            left: 12px;
            top: 260px;
            max-width: 310px;
            padding: 9px 12px;
            font-size: 11px;
            line-height: 1.5;
            color: #b9cce3;
            pointer-events: auto
        }

            #passives strong {
                color: #fff
            }

        #bossHud {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: min(430px,42vw);
            text-align: center;
            display: none;
            padding: 10px
        }

        #bossName {
            font-weight: 700;
            margin-bottom: 6px
        }

        #bossHint {
            font-size: 11px;
            color: #ffd69b;
            margin-top: 6px
        }

        #questHint {
            position: absolute;
            bottom: 165px;
            left: 50%;
            transform: translateX(-50%);
            padding: 9px 16px;
            text-align: center;
            max-width: 550px;
            width: 65%;
            font-size: 12px;
            color: #d3e6ff
        }

        #joystick {
            position: absolute;
            left: max(28px,env(safe-area-inset-left));
            bottom: max(30px,env(safe-area-inset-bottom));
            width: 128px;
            height: 128px;
            border-radius: 50%;
            background: #132b4080;
            border: 2px solid #9cc5dd55;
            pointer-events: auto;
            touch-action: none
        }

        #stick {
            position: absolute;
            left: 39px;
            top: 39px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg,#9ce2e8,#4d7893);
            box-shadow: 0 2px 18px #0008;
            pointer-events: none
        }

        #joystick:after {
            content: 'MOVE';
            position: absolute;
            bottom: 9px;
            width: 100%;
            text-align: center;
            font-size: 9px;
            color: #9cc5dd;
            letter-spacing: 3px
        }

        .action {
            position: absolute;
            border-radius: 50%;
            padding: 0;
            pointer-events: auto;
            touch-action: none;
            box-shadow: 0 4px 24px #0006
        }

            .action span {
                display: block;
                font-size: 10px;
                line-height: 1.3;
                padding: 0 4px
            }

            .action em {
                font-style: normal;
                display: block;
                font-size: 24px
            }

            .action .cd {
                position: absolute;
                inset: 0;
                border-radius: 50%;
                display: grid;
                place-items: center;
                background: #081220bb;
                font-size: 22px;
                font-weight: bold
            }

                .action .cd:empty {
                    display: none
                }

        #fire {
            right: 35px;
            bottom: 46px;
            width: 104px;
            height: 104px;
            background: #285e62;
            border: 2px solid #90efda
        }

        #swap {
            right: 155px;
            bottom: 38px;
            width: 69px;
            height: 69px
        }

        #dash {
            right: 47px;
            bottom: 165px;
            width: 75px;
            height: 75px;
            background: #283e65;
            border: 2px solid #8ac9ff
        }

        #toast {
            position: absolute;
            bottom: 205px;
            left: 50%;
            transform: translateX(-50%);
            background: #081421ef;
            border: 1px solid #94e5dd;
            padding: 12px 20px;
            border-radius: 10px;
            max-width: 600px;
            text-align: center;
            opacity: 0;
            transition: opacity .2s;
            z-index: 15
        }

        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #040a13b8;
            backdrop-filter: blur(5px);
            z-index: 20;
            padding: 18px;
            overflow: auto;
            touch-action: pan-y
        }

        .panel {
            background: linear-gradient(135deg,#142239,#0d1728);
            border: 1px solid #405a77;
            box-shadow: 0 25px 100px #0008;
            border-radius: 20px;
            padding: 28px;
            width: min(960px,100%);
            max-height: 94dvh;
            overflow: auto;
            touch-action: pan-y
        }

            .panel h1 {
                font-size: clamp(34px,6vw,65px);
                margin: 8px 0;
                letter-spacing: -2px
            }

            .panel h2 {
                margin: 5px 0 14px;
                font-size: 25px
            }

            .panel h3 {
                margin: 12px 0 8px
            }

        .muted {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6
        }

        .grid2 {
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 24px
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
            gap: 12px;
            margin: 16px 0
        }

        .card {
            padding: 15px;
            background: #18283d;
            border: 1px solid #38516e;
            border-radius: 12px;
            text-align: left
        }

            .card h3 {
                font-size: 15px;
                margin: 0 0 8px
            }

            .card p {
                font-size: 12px;
                color: #a9bed5;
                line-height: 1.5;
                margin: 5px 0
            }

        .tag {
            display: inline-block;
            font-size: 10px;
            letter-spacing: 1px;
            color: #76e5d2;
            padding: 3px 6px;
            background: #0c1c29;
            border-radius: 4px;
            margin-bottom: 6px
        }

        .sep {
            border: 0;
            border-top: 1px solid #2d4058;
            margin: 18px 0
        }

        .buttons {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            margin-top: 16px
        }

        .legend {
            font-size: 12px;
            color: #bdd0e1;
            line-height: 1.65
        }

        .statline {
            padding: 8px 0;
            border-bottom: 1px solid #293b52;
            font-size: 13px
        }

        .stageList {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 8px;
            margin: 12px 0
        }

            .stageList button {
                text-align: left;
                padding: 12px
            }

            .stageList small {
                display: block;
                color: #adc4da;
                font-size: 11px;
                margin-top: 5px
            }

        .inspectGroup {
            margin: 15px 0;
            background: #0a1422;
            padding: 12px;
            border-radius: 10px
        }

        .inspectFields {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 10px
        }

        .field {
            font-size: 11px;
            color: #aabfd5;
            display: block
        }

            .field input {
                width: 100%;
                background: #1b2b40;
                border: 1px solid #3a506a;
                border-radius: 5px;
                padding: 8px;
                color: white;
                margin-top: 4px
            }

        #bagGrid {
            display: grid;
            grid-template-columns: repeat(8,1fr);
            gap: 4px;
            aspect-ratio: 8/6;
            max-width: 480px;
            width: 100%;
            padding: 7px;
            background: #07111d;
            border: 1px solid #3a506a;
            border-radius: 10px;
            touch-action: none
        }

        .cell {
            background: #17283b;
            border: 1px solid #2a3d55;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            position: relative;
            min-width: 0;
            touch-action: none
        }

            .cell.occupied {
                border-color: #78bdd2;
                background: #275269
            }

            .cell.selected {
                border: 2px solid #ffd780;
                background: #685137
            }

            .cell.previewGood {
                background: #296b55
            }

            .cell.previewBad {
                background: #6b293b
            }

        .bagLayout {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 22px
        }

        .itemBtn {
            width: 100%;
            text-align: left;
            margin: 4px 0;
            padding: 9px 12px
        }

            .itemBtn.selected {
                border-color: #ffcf71;
                background: #4a402d
            }

        .note {
            padding: 10px 12px;
            background: #132f40;
            border-left: 3px solid #6fc7e5;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.6
        }

        .weaponPill {
            font-size: 12px;
            color: #ddedff
        }

        .skill {
            padding: 15px;
            background: #182b41;
            border: 1px solid #3a536e;
            border-radius: 12px;
            margin: 10px 0
        }

        .hide {
            display: none !important
        }

        #error {
            position: fixed;
            bottom: 3px;
            left: 3px;
            color: #ffb9b9;
            background: #200d18;
            z-index: 50;
            font-size: 11px;
            max-width: 90%
        }

        #saveBadge {
            font-size: 11px;
            color: #a9c6d0
        }

        #pauseLabel {
            font-size: 11px;
            color: #abc4d9
        }

        .warning {
            color: #ffcf9a
        }

        select {
            color: white;
            background: #182b40;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #405a77
        }

        @media(max-width:700px) {
            .panel {
                padding: 18px;
                max-height: 96dvh
            }

            .grid2, .bagLayout {
                grid-template-columns: 1fr;
                gap: 14px
            }

            .inspectFields {
                grid-template-columns: repeat(2,1fr)
            }

            .stageList {
                grid-template-columns: repeat(2,1fr)
            }

            .topLeft {
                padding: 8px;
                width: 46vw
            }

            .topRight {
                width: 142px
            }

            #map {
                width: 142px;
                height: 88px
            }

            #passives {
                top: 243px;
                max-width: 220px;
                font-size: 10px;
                padding: 6px;
                opacity: .88
            }

            #joystick {
                width: 112px;
                height: 112px;
                left: 18px;
                bottom: 24px
            }

            #stick {
                left: 33px;
                top: 33px
            }

            #fire {
                right: 17px;
                bottom: 30px;
                width: 90px;
                height: 90px
            }

            #swap {
                right: 120px;
                bottom: 30px;
                width: 65px;
                height: 65px
            }

            #dash {
                right: 24px;
                bottom: 135px;
                width: 68px;
                height: 68px
            }

            #questHint {
                bottom: 160px;
                font-size: 11px;
                left: 45%;
                width: 55%
            }

            #bossHud {
                top: 170px;
                width: 75vw;
                left: 50%
            }

            .cards {
                grid-template-columns: 1fr
            }

            #bagGrid {
                max-width: 360px
            }

            .tally {
                font-size: 10px
            }

            #toast {
                bottom: 215px;
                width: 85%
            }
        }

        @media(max-height:540px) {
            #passives {
                top: auto;
                bottom: 160px;
                font-size: 10px;
                max-width: 240px
            }

            #questHint {
                bottom: 20px;
                max-width: 340px;
                width: 40%
            }

            #bossHud {
                top: 12px;
                width: 35vw
            }

            #joystick {
                width: 105px;
                height: 105px;
                bottom: 18px
            }

            #stick {
                left: 29px;
                top: 29px
            }

            .topLeft {
                width: 260px
            }

            .topRight {
                width: 170px
            }

            #map {
                height: 85px;
                width: 170px
            }

            .tally {
                margin-top: 4px
            }

            #fire {
                bottom: 20px
            }

            #dash {
                bottom: 135px
            }

            #swap {
                bottom: 18px
            }
        }

        /* v0.3 visual-first interface */
        .panel {
            width: min(900px,100%)
        }

        .goldBig {
            font-size: 28px;
            color: var(--gold);
            margin-bottom: 8px
        }

        .visualStages {
            grid-template-columns: repeat(3,1fr)
        }

            .visualStages button {
                padding: 10px;
                text-align: center
            }

            .visualStages small {
                font-size: 11px;
                margin-top: 4px
            }

        .stageArt {
            height: 68px;
            position: relative;
            overflow: hidden;
            display: grid;
            place-items: center;
            margin-bottom: 8px;
            border-radius: 8px;
            background: linear-gradient(135deg,#152b33,#0b172a)
        }

            .stageArt i {
                width: 35px;
                height: 35px;
                background: var(--stageColor);
                opacity: .28;
                position: absolute;
                transform: rotate(30deg) skew(-15deg);
                left: 25%;
                top: 22px;
                box-shadow: 8px 9px 0 #0b182c
            }

                .stageArt i:nth-child(2) {
                    left: 50%;
                    top: 12px;
                    opacity: .38
                }

                .stageArt i:nth-child(3) {
                    left: 65%;
                    top: 37px;
                    opacity: .18
                }

            .stageArt span {
                font-size: 35px;
                z-index: 1;
                color: var(--stageColor);
                text-shadow: 0 3px 10px #000
            }

        .menuFooter {
            margin: 20px 0 15px;
            align-items: stretch
        }

        .techMini {
            display: flex;
            gap: 8px
        }

            .techMini button {
                font-size: 18px;
                text-align: left
            }

            .techMini small {
                font-size: 10px;
                display: block;
                margin-top: 4px;
                color: #b0c6db
            }

        .playBig {
            font-size: 20px;
            min-width: 170px
        }

        .controlDiagram {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 16px 0 12px;
            padding: 12px;
            background: #0714247a;
            border-radius: 14px
        }

            .controlDiagram > div {
                text-align: center
            }

            .controlDiagram i {
                font-style: normal;
                width: 45px;
                height: 45px;
                display: grid;
                place-items: center;
                font-size: 25px;
                border: 1px solid #7897b4;
                border-radius: 50%;
                background: #21374e
            }

            .controlDiagram .fireDiagram {
                background: #235a5e;
                border-color: #84ead2
            }

            .controlDiagram .joyDiagram {
                border: 4px double #8db7cd;
                background: #152737
            }

            .controlDiagram span {
                display: block;
                font-size: 10px;
                color: #aac2da;
                margin-top: 5px
            }

        .helpFlow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin: 20px 0;
            background: #101e2f;
            padding: 20px;
            border-radius: 12px
        }

            .helpFlow > div {
                text-align: center
            }

            .helpFlow i {
                font-style: normal;
                font-size: 34px;
                display: block;
                color: #99e6da
            }

            .helpFlow span {
                display: block;
                color: #aec7df;
                font-size: 11px;
                margin-top: 6px
            }

            .helpFlow b {
                color: #7f92a7
            }

        .typeBadge {
            display: inline-block;
            border: 1px solid;
            border-radius: 5px;
            padding: 3px 6px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .5px;
            margin-bottom: 5px;
            line-height: 1.4
        }

        .typeActive {
            color: #98ddff !important;
            background: #143149 !important;
            border-color: #568dad !important
        }

        .typePassive {
            color: #dfb9ff !important;
            background: #2a1b3d !important;
            border-color: #8967a5 !important
        }

        .typeHeading {
            font-size: 9px;
            letter-spacing: .8px;
            border-radius: 4px;
            padding: 4px 5px;
            margin: 2px 0 6px;
            border: 1px solid
        }

        .weaponArt {
            width: 64px;
            height: 64px;
            display: block;
            margin: 0 auto 5px
        }

        .itemBtn {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0;
            padding: 7px 9px
        }

            .itemBtn .weaponArt {
                width: 34px;
                height: 34px;
                flex-shrink: 0;
                margin: 0
            }

            .itemBtn small {
                color: #adc3d8;
                font-size: 10px
            }

        .selectedDetail {
            font-size: 11px;
            line-height: 1.5;
            padding: 8px;
            background: #0d1b2b;
            border-radius: 8px;
            margin-top: 8px
        }

            .selectedDetail .typeBadge {
                font-size: 8px
            }

        .bagExample {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9db5ca;
            font-size: 11px;
            margin: 8px
        }

            .bagExample .weaponArt {
                width: 65px;
                height: 65px;
                margin: 0 8px
            }

        .upgradeActions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 12px
        }

            .upgradeActions button {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 11px
            }

            .upgradeActions .awakenBtn {
                color: #ffe5a0;
                border-color: #b09b61;
                background: #443823;
                display: block;
                margin-top: 5px
            }

        .upgradeCard .bar {
            margin: 8px 0
        }

        .upgradeCard .row {
            font-size: 11px
        }

        .upgradeCard > h3 {
            font-size: 14px
        }

        .sealCount {
            color: #ffe1a0;
            margin-left: 15px
        }

        .workLegend {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            color: #aec5dc;
            font-size: 11px
        }

        .variantName {
            color: #e4d0a6;
            font-size: 13px
        }

        .weaponOffers .weaponArt {
            width: 88px;
            height: 88px
        }

        .weaponOffers .card {
            text-align: center
        }

        .pickLabel {
            display: block;
            font-size: 10px;
            color: #8eecd5;
            letter-spacing: 1px;
            margin-top: 18px
        }

        .offerEffect {
            color: #9cb5d0;
            font-size: 12px;
            margin-top: 13px
        }

        .questIcons {
            display: flex;
            gap: 15px;
            justify-content: space-around;
            margin: 20px 0
        }

            .questIcons > div {
                text-align: center;
                color: #9cb0c2
            }

            .questIcons i {
                font-size: 32px;
                display: block;
                font-style: normal
            }

            .questIcons span {
                display: block;
                font-size: 11px;
                margin-top: 6px
            }

        .questRewards {
            padding: 8px 0;
            color: #ffe1a6;
            font-size: 15px;
            margin-bottom: 8px
        }

        .doneGlyph {
            color: #7de5bc !important
        }

        .liveGlyph {
            color: #ff9b8e !important
        }

        .biomeGlyphs {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #8fa7bb;

        function update(dt){if(!game||modal||mode!=='play')return;let g=game,p=g.p;g.time+=dt;p.inv=Math.max(0,p.inv-dt);p.parry=Math.max(0,p.parry-dt);p.dashCD=Math.max(0,p.dashCD-dt);p.anim=Math.max(0,p.anim-dt);p.manaWait=Math.max(0,(p.manaWait||0)-dt);if(p.dashLeft>0){let step=Math.min(dt,p.dashLeft),ox=p.x,oy=p.y;p.x=clamp(p.x+p.dashVX*step,18,1782);p.y=clamp(p.y+p.dashVY*step,18,1082);p.dashLeft=Math.max(0,p.dashLeft-step);if(g.raid){raidClampG(p);}g.effects.push({x:ox,y:oy,x2:p.x,y2:p.y,c:'#9feaff',life:.22,max:.22,trail:true});}else if(len(joy.x,joy.y)>.08){let l=len(joy.x,joy.y),speed=config.moveSpeed*(1+meta.speed*.06);p.x=clamp(p.x+joy.x*speed*dt,18,1782);p.y=clamp(p.y+joy.y*speed*dt,18,1082);p.faceX=joy.x/l;p.faceY=joy.y/l;}if(g.raid){raidClampG(p);g.raidTime-=dt;if(g.raidTime<=0){g.raidTime=0;defeat('Raid time expired.');return;}}else{let b=biomeAt(p.x,p.y),z=g.biomes[b];if(!z.visited&&len(p.x-bpx(b),p.y-bpy(b))<62){z.visited=true;notify(`◇ ${BIOMES[b].name} beacon ✓`);tone(650,.18);questUpdate(b);}if(z.visited&&z.spawned<config.tallyTarget&&g.enemies.filter(e=>!e.dead&&!e.boss).length<config.maxEnemies){z.spawnClock+=dt*config.spawnRate;while(z.spawnClock>=1&&z.spawned<config.tallyTarget&&g.enemies.filter(e=>!e.dead&&!e.boss).length<config.maxEnemies){z.spawnClock--;spawnEnemy(b);}}if(!z.wardenSpawned&&z.kills>=Math.ceil(config.tallyTarget*.5))spawnWarden(b);}

fireWeapon=function(){

 const w=game.weapons.find(w=>w.id===game.active);if(!w||w.cd>0)return;
 const d=DEF[w.id],t=nearest(d.kind==='melee'?(d.range||190)+30:800);if(!t)return;
 w.cd=cooldown(w);p.anim=.2;const dm=damage(w),ang=Math.atan2(t.y-p.y,t.x-p.x);

  else if(d.key==='shield'){for(const e of [...game.enemies])if(!e.dead&&dist(e,p)<125+e.r&&Math.cos(Math.atan2(e.y-p.y,e.x-p.x)-ang)>0){hurtEnemy(e,dm*1.2);if(!e.dead){const k=e.boss?12:80,l=dist(e,p)||1;e.x+=(e.x-p.x)/l*k;e.y+=(e.y-p.y)/l*k;}}game.effects.push({x:p.x+Math.cos(ang)*60,y:p.y+Math.sin(ang)*60,c:d.color,life:.2,max:.2,ring:60});}
  else if(d.key==='bow'){const n=1+Math.floor(w.speed*config.weaponSpeedGain*4);for(let i=0;i<n;i++)pShot(ang+(i-(n-1)/2)*.11,360,dm*1.15,w,{pierce:2,r:5*variantOf(w).area});}

 if(d.key==='necro')for(let i=0;i<3;i++)pShot(a+(i-1)*.7,190,dm*.8,w,{home:true,life:4,r:9});

const _update=update;
update=function(dt){
 if(!game||modal||mode!=='play')return;
 const g=game,p=g.p;if(!g.v6)return _update(dt);
 p.ko=Math.max(0,(p.ko||0)-dt);
 const jx=joy.x,jy=joy.y,fh=fireHeld,real=g.weapons,slow=g.ult.on?.45:1;
 if(p.ko>0||p.kb>0){joy.x=joy.y=0;}else{joy.x*=slow;joy.y*=slow;}
 fireHeld=false;
 const mine=g.shots.filter(s=>s.pl);g.shots=g.shots.filter(s=>!s.pl);g.weapons=[];
 try{_update(dt);}finally{if(game===g)g.weapons=real;joy.x=jx;joy.y=jy;fireHeld=fh;}
 if(game!==g)return;
 if(mode!=='play'){g.shots=g.shots.concat(mine);return;}
 if(p.kb>0){const s=Math.min(dt,p.kb);p.x=clamp(p.x+p.kbx*s,18,1782);p.y=clamp(p.y+p.kby*s,18,1082);p.kb-=s;if(g.raid){raidClampG(p);}}
 for(const w of g.weapons){w.cd=Math.max(0,w.cd-dt);const d=DEF[w.id];if(ACT(w.id)||p.ko>0)continue;
  w.timer-=dt;if(w.timer>0)continue;
  const sp=config.attackSpeed*(1+w.speed*config.weaponSpeedGain)*variantOf(w).rate;
  if(d.kind==='auto'){const ac=config.passiveMana;if(!nearestTo(p.x,p.y,260)){w.timer=.3;continue;}if(p.mp<ac){w.timer=.3;w.dry=1;if(game.time>(game.dryNote||0)){notify(LB('Passives need MP · kill enemies to refill','패시브는 마나 필요 · 적을 처치해 회복'));game.dryNote=game.time+8;}continue;}p.mp-=ac;w.dry=0;w.timer=d.every/sp;autoAttack(w,d);}
  else{const t=nearestTo(p.x,p.y,d.range*(1+w.aoe*config.weaponAOEGain));if(!t){w.timer=.2;continue;}if(p.mp<d.mpc){w.timer=.3;continue;}p.mp-=d.mpc;w.timer=2/sp;castSpell(w,d,t);}}
 for(const s of mine){s.life-=dt;
  if(s.home){const t=nearestTo(s.x,s.y,420);if(t){const sp=len(s.vx,s.vy),ca=Math.atan2(s.vy,s.vx);let da=Math.atan2(t.y-s.y,t.x-s.x)-ca;da=Math.atan2(Math.sin(da),Math.cos(da));const na=ca+clamp(da,-4*dt,4*dt);s.vx=Math.cos(na)*sp;s.vy=Math.sin(na)*sp;}}
  s.x+=s.vx*dt;s.y+=s.vy*dt;
  for(const e of [...g.enemies]){if(e.dead||s.hit.has(e)||len(s.x-e.x,s.y-e.y)>=s.r+e.r)continue;s.hit.add(e);withEl(s.el,()=>hurtEnemy(e,s.dmg));if(s.pierce-->0){}else{s.life=0;break;}}}
 g.shots=g.shots.concat(mine.filter(s=>s.life>0&&s.x>-50&&s.x<1850&&s.y>-50&&s.y<1150));g.enemies=g.enemies.filter(e=>!e.dead);
 for(const s of g.sched)s.t-=dt;const due=g.sched.filter(s=>s.t<=0);g.sched=g.sched.filter(s=>s.t>0);due.forEach(s=>s.fn());
 for(const o of g.pools){o.life-=dt;o.tick-=dt;if(o.tick<=0){o.tick=.4;areaEl(o.x,o.y,o.r,o.dmg,'acid');}}g.pools=g.pools.filter(o=>o.life>0);
 for(const t of g.bt){t.life-=dt;t.y-=18*dt;}g.bt=g.bt.filter(t=>t.life>0);
 ultTick(dt);
 if(fh&&mode==='play')fireWeapon();
};

 vis.sort((a,b)=>b[0]-a[0]);
 for(const [d,t] of vis){const cx=t.cx,cy=t.cy,j=t.j;if(config.terrainLow){cube(cx,cy,-12+j,T,12,t.top);continue;}if(t.edge){cube(cx,cy,-54,T,40,t.stone);cube(cx,cy,-14,T,14+j,t.soil);cube(cx,cy,-4+j,T,4,t.top);}else cube(cx,cy,-12+j,T,12,t.top);}
 const glow=.5+.25*Math.sin(performance.now()/450);ctx.save();ctx.globalAlpha=.7;for(let i=0;i<3;i++){line3(BIGT[i],BIGT[(i+1)%3],'rgba(205,220,255,.85)',2,6);}ctx.globalAlpha=glow+.25;for(let i=0;i<3;i++){line3(CEN[i],CEN[(i+1)%3],'rgba(205,190,255,.95)',2,6);}ctx.restore();

 for(const [d,m,big] of pil){if(d<-60||d>CAM.far)continue;if(big){cube(m[0],m[1],0,28,10,'#8a86b8');cube(m[0],m[1],10,20,56,'#a9a4d6');cube(m[0],m[1],66,24,8,'#d7d3f5');}else{cube(m[0],m[1],0,20,10,'#8a86b8');cube(m[0],m[1],10,14,40,'#a9a4d6');cube(m[0],m[1],50,18,7,'#d7d3f5');}}

CAM.dist=115;CAM.hgt=78;CAM.far=1250;CAM.fogS=430;CAM.fogL=780;
let faceQueueV=[];
cube=function(x,y,z,size,h,c){
 const dc=depthOf(x,y);if(dc < -size-h || dc>CAM.far+size)return;
 const hs=size/2,x0=x-hs,x1=x+hs,y0=y-hs,y1=y+hs,z1=z+h;
 const V=[cam3(x0,y0,z),cam3(x1,y0,z),cam3(x1,y1,z),cam3(x0,y1,z),cam3(x0,y0,z1),cam3(x1,y0,z1),cam3(x1,y1,z1),cam3(x0,y1,z1)];
 let vis=[];if(CAM.z>z1)vis.push(0);if(CAM.x>x1)vis.push(1);if(CAM.x<x0)vis.push(2);if(CAM.y>y1)vis.push(3);if(CAM.y<y0)vis.push(4);
 const sh=shades5(c);for(const f of vis){const pts=CUBE_FACES[f].map(i=>V[i]);faceQueueV.push({pts,c:sh[f],d:pts.reduce((a,p)=>a+p[2],0)/4});}
};
function flushV(){faceQueueV.sort((a,b)=>b.d-a.d);for(const f of faceQueueV){fillCam(f.pts,f.c);const fog=Math.max(0,Math.min(.88,(f.d-430)/800));if(fog){ctx.save();ctx.globalAlpha=fog;fillCam(f.pts,'#182a35');ctx.restore();}}faceQueueV=[];}
function blockerV(d){const k=BIOMES[d.b].kind||0;return k===2||k===6||k===8||(k===0&&d.type>.7);}
function sightV(x,y){if(!game)return true;const p=game.p,dx=x-p.x,dy=y-p.y,L=Math.hypot(dx,dy);if(L<38)return true;if((dx*camF.x+dy*camF.y)/L<.12||L>940)return false;
 for(const d of decor){if(!blockerV(d))continue;const u=((d.x-p.x)*dx+(d.y-p.y)*dy)/(L*L);if(u>.07&&u<.95){const r=BIOMES[d.b].kind===6?30:12;if(Math.hypot(d.x-p.x-u*dx,d.y-p.y-u*dy)<r)return false;}}return true;}
function voxelActorV(e,player=false,col){
 const boss=!player&&e.boss,k=player?-1:(BIOMES[e.biome].kind||0),S=boss?(e.final?2.3:1.7):1;
 const a=player?(e.fa===undefined?Math.atan2(e.faceY||0,e.faceX||1):e.fa):Math.atan2(game.p.y-e.y,game.p.x-e.x),fx=Math.cos(a),fy=Math.sin(a),rx=-fy,ry=fx;
 const walk=Math.sin((game?game.time:0)*9+e.x*.03)*3,skin=e.flash>0?'#ffffff':col|| (player?'#4797c4':BIOMES[e.biome].color),dark=player?'#243751':shadeX(skin,.48);
 let parts=[];const box=(r,f,z,w,h,c)=>parts.push([e.x+(rx*r+fx*f)*S,e.y+(ry*r+fy*f)*S,z*S,w*S,h*S,c]);
 if(k===0||k===5){box(0,0,0,27,13,skin);box(0,0,13,21,11,skin);box(-6,12,15,4,4,'#101c22');box(6,12,15,4,4,'#101c22');box(0,0,24,8,4,k===5?'#e4ff93':skin);}
 else{box(-7,0,Math.max(0,walk),9,17,dark);box(7,0,Math.max(0,-walk),9,17,dark);box(0,0,17,23,24,skin);box(-17,0,18-walk,8,21,skin);box(17,0,18+walk,8,21,skin);box(0,0,41,19,18,player?'#dab48d':skin);box(0,0,56,22,5,dark);box(-5,10,48,4,4,'#101c22');box(5,10,48,4,4,'#101c22');if(player){box(0,-13,22,13,18,'#70553c');box(18,12,23,6,27,'#b8ecff');}if(boss){box(-13,0,57,8,18,'#ffe0a1');box(13,0,57,8,18,'#ffe0a1');}}
 parts.forEach(p=>cube(...p));
 if(!player&&e.state==='windup')worldCircle(e.x,e.y,40*S,'#ff8060',3);
}

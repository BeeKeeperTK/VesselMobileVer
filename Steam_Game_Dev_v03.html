@import url('https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=clash-display@600&display=swap');
:root{--bg:#101a25;--panel:#172737;--panel2:#1e3549;--ink:#ebf3f9;--muted:#a5bbcb;--line:rgba(195,222,240,.17);--blue:#74b9e5;--green:#b4d47d;--gold:#e7be6c;--red:#e6928d;--shadow:0 14px 32px rgba(0,0,0,.22)}[data-theme=light]{--bg:#e9f0f5;--panel:#fff;--panel2:#deebf4;--ink:#172a39;--muted:#546f83;--line:rgba(24,54,76,.18);--blue:#13669a;--green:#517727;--gold:#9b6711;--red:#a54440;--shadow:0 10px 25px rgba(25,58,82,.13)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 87% 0,rgba(48,112,151,.28),transparent 33%),var(--bg);color:var(--ink);font-family:'Satoshi',sans-serif}.shell{max-width:1240px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border:2px solid var(--blue);border-radius:7px;position:relative}.logo:after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:var(--green);right:-5px;bottom:-5px}.brand b{font-family:'Clash Display';font-size:20px}.brand small{display:block;color:var(--muted);font-size:12px}.top-tools{display:flex;gap:8px;align-items:center}.chip,.top-tools button{border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);padding:8px 10px;font:600 12px 'Satoshi';min-height:36px}.top-tools button.active{background:var(--blue);color:#102536;border-color:transparent}.money{color:var(--green);font-weight:700}.steps{display:flex;gap:6px;overflow:auto;padding:18px 0 10px}.step{flex:1;min-width:132px;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:13px;color:var(--muted);background:rgba(0,0,0,.07)}.step.active{border-color:var(--blue);background:var(--panel2);color:var(--ink)}.step.done{color:var(--green)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 385px;gap:16px}.card{background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel) 74%,#0a1119));border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.stage{padding:22px;min-height:610px;position:relative;overflow:hidden}.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);font-weight:700}.stage h1{font:600 clamp(27px,3vw,42px)/1.14 'Clash Display';max-width:750px;margin:9px 0}.stage>p{color:var(--muted);max-width:690px;line-height:1.55;margin:0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px;position:relative;z-index:2}.choice{min-height:94px;padding:13px;border:1px solid var(--line);border-radius:9px;background:rgba(5,14,21,.16);color:var(--ink);text-align:left}.choice:hover,.choice.sel{border-color:var(--blue);background:color-mix(in srgb,var(--panel2) 75%,var(--blue))}.choice b{display:block;font-size:16px}.choice span{display:block;font-size:13px;color:var(--muted);line-height:1.35;margin-top:4px}.actions{display:flex;justify-content:space-between;gap:9px;margin-top:20px;position:relative;z-index:2}.btn{padding:11px 16px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font-weight:700}.btn.primary{background:var(--blue);color:#102637;border-color:transparent}.btn:disabled{opacity:.4;cursor:not-allowed}.flow-art{position:absolute;right:-60px;bottom:-40px;width:410px;height:260px;opacity:.2;pointer-events:none}.side{display:grid;gap:16px;align-content:start}.play-card{overflow:hidden}.panel-hd{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}.panel-hd b{font-size:14px}.live{font-size:11px;color:var(--green);font-weight:700}.game-wrap{position:relative;background:#0c1720}.game-wrap canvas{display:block;width:100%;height:270px;image-rendering:pixelated}.game-help{padding:10px 14px;color:var(--muted);font-size:12px;line-height:1.45}.portrait{display:flex;gap:13px;padding:14px}.portrait canvas{width:78px;height:78px;flex:0 0 78px;border-radius:9px;border:1px solid var(--line);background:#102130}.portrait h3{font-size:15px;margin:0 0 4px}.portrait p{font-size:12px;line-height:1.42;margin:0;color:var(--muted)}.portrait strong{display:block;font-size:11px;color:var(--green);margin-top:6px}.archive{padding:13px}.archive summary{cursor:pointer;font-size:13px;color:var(--muted)}.archive-list{display:grid;gap:6px;margin-top:10px}.archive-row{display:flex;justify-content:space-between;gap:5px;padding:8px;border:1px solid var(--line);border-radius:7px;font-size:12px}.archive-row button{border:0;background:none;color:var(--blue);font-weight:700}.finish{display:none;position:absolute;inset:0;background:linear-gradient(145deg,rgba(19,39,53,.97),rgba(15,29,41,.97));z-index:5;padding:28px}.finish.show{display:block}.finish h2{font:600 30px 'Clash Display';margin:10px 0}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.metric{border:1px solid var(--line);border-radius:8px;padding:10px}.metric b{display:block;color:var(--green);font-size:20px}.metric span{font-size:11px;color:var(--muted)}.loop-note{border-left:3px solid var(--gold);padding:9px 11px;background:rgba(230,188,104,.08);font-size:13px;color:var(--muted)}@media(max-width:880px){.layout{grid-template-columns:1fr}.stage{min-height:auto}.top{align-items:flex-start}.top-tools{flex-wrap:wrap;justify-content:flex-end}.game-wrap canvas{height:250px}}@media(max-width:530px){.shell{padding:12px}.choices{grid-template-columns:1fr}.top{gap:8px}.brand small{display:none}.top-tools{gap:4px}.top-tools button,.chip{padding:7px}.stage{padding:17px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><i class="logo"></i><div><b>FIRST RELEASE</b><small id="sub"></small></div></div><div class="top-tools"><span class="chip money" id="cash"></span><button id="theme">☾</button><button id="en" class="active">EN</button><button id="ko">한국어</button></div></header><nav class="steps" id="steps"></nav><section class="layout"><section class="card stage" id="stage"><svg class="flow-art" viewBox="0 0 410 260"><path d="M20 210L140 80l70 85 130-125" fill="none" stroke="#8ed0f3" stroke-width="4"/><circle cx="140" cy="80" r="18" fill="#e7be6c"/></svg><div id="finish" class="finish"></div></section><aside class="side"><section class="card play-card"><div class="panel-hd"><b id="playTitle"></b><span class="live" id="live"></span></div><div class="game-wrap"><canvas id="game" width="760" height="540"></canvas></div><div class="game-help" id="help"></div></section><section class="card portrait"><canvas id="portrait" width="156" height="156"></canvas><div><h3 id="personName"></h3><p id="personText"></p><strong id="personStatus"></strong></div></section><details class="card archive"><summary id="archiveTitle"></summary><div id="archive" class="archive-list"></div></details></aside></section></main><script>
const TXT={en:{sub:'A focused simulator for shipping your first Steam game',cash:'$100 studio cash',steps:['Pitch','Engine','Build','Test','Publish'],heads:['Pick one sharp game promise.','Choose an engine path.','Make it playable.','Test the build, then respond.','Prepare a release, then repeat.'],desc:['You begin with almost no money, no team, and no audience. Choose a small, marketable core before you add anything else.','Every engine has a trade-off. You may stay solo, subscribe to AI assistance, or hire later; none is mandatory.','Change a parameter, then immediately play it. Use WASD or arrow keys in the live canvas.','A result is only useful if it changes the next decision. Run a test, interpret it, and revise the current build.','Publishing is a loop checkpoint, not the end. Release, see the simulated result, archive what you learned, and start another project.'],opts:[[('Cozy management|Small shop, daily trade-offs.'),('Precision platformer|Tight movement and short levels.'),('Narrative mystery|Grounded investigation and dialogue.'),('Warehouse puzzle|Space, systems, satisfying logistics.')],[('Godot|Free and lean for a small 2D scope.'),('Unity|Familiar 2D workflow; plan costs matter later.'),('RPG Maker MZ|Fast dialogue-forward 2D production.'),('Unreal Engine|Powerful, but costly in learning time.')],[('Movement feel|Switch between tight / floaty / deliberate.'),('Visual language|Line art / warm print / monochrome.'),('Level shape|Edit the route while you play.'),('Production plan|Solo / contractor / AI assistance.')],[('Run playtest|Collect focused notes from 20 testers.'),('Fix clarity|Goals and onboarding first.'),('Fix feel|Control response, timing, feedback.'),('Keep scope|Ship the core instead of feature creep.')],[('Register app|Simulated $100 Steam Direct entry cost.'),('Prepare page|Capsule, screenshots, tags, trailer plan.'),('Submit build|Resolve release blockers.'),('Launch|Release this small commercial game.')]],next:'Continue',back:'Back',play:'Playable build',live:'LIVE · WASD / ARROWS',help:'This is a real minimal test game, not a static picture. Reach the green exit; your current genre changes the level.',portraitName:'Mina Park — contract artist',portrait:'A clear design brief makes a better store capsule than more words. I can work per deliverable; hiring is optional.',status:'Sketching a readable visual direction',archive:'Development archive — reopen past stages',revisit:'Revisit',finishTitle:'Your first release is now in the market.',finishBody:'Week one results are simulated from your scope and development choices. The real loop begins now: read the result, retain lessons, and make the next game.',again:'Start next project',review:'Review this project',sales:'Wishlists',revenue:'Revenue',rating:'Player rating',testDone:'Playtest complete: players understand the goal, but want the movement to feel more intentional.',toast:'Test result saved to your archive.'},ko:{sub:'첫 Steam 게임 출시를 위한 집중형 개발 시뮬레이터',cash:'스튜디오 자금 $100',steps:['기획','엔진','제작','테스트','출시'],heads:['하나의 날카로운 게임 약속을 고르세요.','엔진 경로를 선택하세요.','플레이할 수 있게 만드세요.','빌드를 테스트하고 대응하세요.','출시를 준비한 뒤, 다시 시작하세요.'],desc:['돈도 팀도 관객도 거의 없이 시작합니다. 무엇을 추가하기 전에 작고 팔 수 있는 핵심을 고르세요.','모든 엔진에는 대가가 있습니다. 혼자 남아도 되고, AI 보조를 구독해도 되고, 나중에 고용해도 됩니다. 어느 것도 필수는 아닙니다.','수치를 바꾸고 즉시 플레이하세요. 라이브 캔버스에서 WASD 또는 방향키를 사용합니다.','결과는 다음 결정을 바꿀 때만 의미가 있습니다. 테스트를 실행하고, 해석하고, 현재 빌드를 수정하세요.','출시는 끝이 아니라 루프의 체크포인트입니다. 결과를 보고, 배운 것을 보관하고, 다음 프로젝트를 시작하세요.'],opts:[[('아늑한 경영|작은 가게와 일상의 선택.'),('정밀 플랫포머|단단한 이동과 짧은 레벨.'),('서사 미스터리|현실적인 조사와 대화.'),('창고 퍼즐|공간, 시스템, 만족스러운 물류.')],[('Godot|작은 2D 범위에 맞는 가볍고 무료인 엔진.'),('Unity|친숙한 2D 흐름; 플랜 비용은 나중의 문제.'),('RPG Maker MZ|대화 중심 2D 제작을 빠르게.'),('Unreal Engine|강력하지만 학습 시간이 비쌉니다.')],[('이동 감각|단단하게 / 둥둥 뜨게 / 신중하게 전환.'),('시각 언어|선화 / 따뜻한 인쇄 / 흑백.'),('레벨 형태|플레이하면서 경로를 편집하세요.'),('제작 계획|혼자 / 외주 / AI 보조.')],[('플레이테스트 실행|20명의 테스터에게 집중 메모를 받습니다.'),('명확성 수정|목표와 온보딩을 먼저 개선합니다.'),('손맛 수정|조작 반응, 타이밍, 피드백.'),('범위 유지|기능 과잉보다 핵심을 출시.')],[('앱 등록|Steam Direct 진입 비용 $100 시뮬레이션.'),('페이지 준비|캡슐, 스크린샷, 태그, 트레일러 계획.'),('빌드 제출|출시 차단 요소를 해결합니다.'),('출시|이 작은 상업 게임을 출시합니다.')]],next:'계속',back:'이전',play:'플레이 가능한 빌드',live:'실시간 · WASD / 방향키',help:'정지 이미지가 아닌 실제 최소 테스트 게임입니다. 초록 출구에 도달하세요. 선택한 장르가 레벨에 반영됩니다.',portraitName:'박미나 — 계약 아티스트',portrait:'말보다 명확한 기획서가 더 좋은 스토어 캡슐을 만듭니다. 납품 단위로 작업할 수 있고, 고용은 선택입니다.',status:'읽기 쉬운 비주얼 방향을 스케치하는 중',archive:'개발 아카이브 — 지난 단계 다시 열기',revisit:'다시 보기',finishTitle:'첫 번째 게임이 이제 시장에 나왔습니다.',finishBody:'첫 주 결과는 범위와 개발 선택을 바탕으로 시뮬레이션됩니다. 이제 진짜 루프가 시작됩니다. 결과를 읽고, 배운 것을 보관하고, 다음 게임을 만드세요.',again:'다음 프로젝트 시작',review:'이 프로젝트 검토',sales:'위시리스트',revenue:'매출',rating:'유저 평점',testDone:'플레이테스트 완료: 플레이어가 목표는 이해했지만 이동감이 더 의도적이기를 원합니다.',toast:'테스트 결과가 아카이브에 저장되었습니다.'}};
let lang='en',stage=0,sel=[0,0,0,0,0],archive=[],theme='dark',player={x:50,y:410,vx:0,vy:0,on:false},keys={},frame=0;const $=x=>document.getElementById(x);function t(){return TXT[lang]}function split(s){return s.split('|')}function render(){let a=t();document.documentElement.lang=lang;$('sub').textContent=a.sub;$('cash').textContent=a.cash;$('playTitle').textContent=a.play;$('live').textContent=a.live;$('help').textContent=a.help;$('personName').textContent=a.portraitName;$('personText').textContent=a.portrait;$('personStatus').textContent=a.status;$('archiveTitle').textContent=a.archive;$('steps').innerHTML=a.steps.map((x,i)=>`<div class="step ${i===stage?'active':''} ${i<stage?'done':''}">${i<stage?'✓ ':''}${i+1}. ${x}</div>`).join('');let op=a.opts[stage];$('stage').querySelectorAll(':scope > .content').forEach(x=>x.remove());let d=document.createElement('div');d.className='content';d.innerHTML=`<div class="eyebrow">${a.steps[stage]} · ${stage+1}/5</div><h1>${a.heads[stage]}</h1><p>${a.desc[stage]}</p><div class="choices">${op.map((s,i)=>{let q=split(s);return `<button class="choice ${sel[stage]===i?'sel':''}" data-i="${i}"><b>${q[0]}</b><span>${q[1]}</span></button>`}).join('')}</div>${stage===3?`<div class="loop-note" id="testNote">${a.testDone}</div>`:''}<div class="actions"><button class="btn" id="back" ${stage===0?'disabled':''}>${a.back}</button><button class="btn primary" id="next">${stage===4?a.opts[4][3].split('|')[0]:a.next}</button></div>`;$('stage').append(d);d.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{sel[stage]=+b.dataset.i;drawLevel();render()});$('back').onclick=()=>{stage--;render()};$('next').onclick=()=>{if(stage===3)archive.push(`${a.steps[3]} — ${a.testDone}`);if(stage<4){archive.push(`${a.steps[stage]} — ${split(a.opts[stage][sel[stage]])[0]}`);stage++;render()}else finish()};$('archive').innerHTML=archive.length?archive.map((x,i)=>`<div class="archive-row"><span>${x}</span><button data-r="${Math.min(i,4)}">${a.revisit}</button></div>`).join(''):`<div class="archive-row"><span>${lang==='en'?'Completed decisions will collect here.':'완료한 결정이 여기에 쌓입니다.'}</span></div>`;$('archive').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{stage=+b.dataset.r;render()});drawPortrait();}
function finish(){let a=t(),f=$('finish');f.innerHTML=`<div class="eyebrow">${lang==='en'?'Market week 1':'시장 첫 주'}</div><h2>${a.finishTitle}</h2><p>${a.finishBody}</p><div class="metric-grid"><div class="metric"><b>${120+sel[0]*85}</b><span>${a.sales}</span></div><div class="metric"><b>$${320+sel[1]*120}</b><span>${a.revenue}</span></div><div class="metric"><b>${(3.1+sel[2]*.25).toFixed(1)}/5</b><span>${a.rating}</span></div></div><div class="loop-note">${lang==='en'?'Steam Direct uses a $100 product fee; the real policy is more detailed than this simulation.':'Steam Direct는 제품당 100달러의 비용을 사용합니다. 실제 정책은 이 시뮬레이션보다 더 복잡합니다.'}</div><div class="actions"><button class="btn" id="review">${a.review}</button><button class="btn primary" id="again">${a.again}</button></div>`;f.classList.add('show');$('review').onclick=()=>{f.classList.remove('show');stage=3;render()};$('again').onclick=()=>{stage=0;sel=[0,0,0,0,0];archive=[];player={x:50,y:410,vx:0,vy:0,on:false};f.classList.remove('show');render()}}
function drawPortrait(){let c=$('portrait'),x=c.getContext('2d'),b=Math.sin(frame/20)*2;x.clearRect(0,0,156,156);x.fillStyle='#172e40';x.fillRect(0,0,156,156);x.strokeStyle='#c4e0ef';x.lineWidth=3;x.lineCap='round';x.beginPath();x.arc(78,57+b,27,0,Math.PI*2);x.stroke();x.beginPath();x.moveTo(36,142);x.quadraticCurveTo(43,98+b,78,96+b);x.quadraticCurveTo(113,98+b,120,142);x.stroke();x.beginPath();x.moveTo(55,54+b);x.lineTo(68,54+b);x.moveTo(88,54+b);x.lineTo(101,54+b);x.moveTo(67,74+b);x.quadraticCurveTo(78,81+b,89,74+b);x.stroke();x.fillStyle='#e7be6c';x.fillRect(61,53+b,5,5);x.fillRect(91,53+b,5,5)}
function drawLevel(){let c=$('game'),x=c.getContext('2d'),w=c.width,h=c.height,g=sel[0];x.fillStyle=g===0?'#305d58':g===1?'#202e4b':g===2?'#3f4350':'#5a4835';x.fillRect(0,0,w,h);for(let i=0;i<15;i++){x.strokeStyle='rgba(220,240,250,.08)';x.beginPath();x.moveTo(0,i*42+20);x.lineTo(w,i*42+20);x.stroke()}let plats=g===1?[[0,480,180,60],[240,410,130,20],[450,335,130,20],[620,260,140,20]]:[[0,480,760,60],[220,390,135,20],[470,315,120,20]];x.fillStyle='#95b9cc';plats.forEach(p=>x.fillRect(...p));x.fillStyle='#b4d47d';x.fillRect(700,410,28,70);x.fillStyle='#1a2c39';x.fillRect(705,418,18,23);x.strokeStyle='#cbe8f5';x.strokeRect(700,410,28,70);x.fillStyle='#e7be6c';x.fillRect(player.x,player.y,23,30);x.fillStyle='#182432';x.fillRect(player.x+4,player.y-10,15,14);x.fillStyle='#e7f0f7';x.font='bold 15px sans-serif';x.fillText(split(t().opts[0][g])[0],16,25);return plats}
function tick(){frame++;let plats=drawLevel(),p=player;let sp=sel[2]===0?1.1:sel[2]===1?.7:.9;if(keys.ArrowLeft||keys.a)p.vx-=sp;if(keys.ArrowRight||keys.d)p.vx+=sp;p.vx*=.83;p.vy+=.7;p.x+=p.vx;p.y+=p.vy;p.on=false;plats.forEach(q=>{if(p.x+23>q[0]&&p.x<q[0]+q[2]&&p.y+30>=q[1]&&p.y+30<=q[1]+20&&p.vy>=0){p.y=q[1]-30;p.vy=0;p.on=true}});if((keys.ArrowUp||keys.w||keys[' '])&&p.on)p.vy=-12;if(p.x<0)p.x=0;if(p.x>737)p.x=737;if(p.y>540){p.x=50;p.y=410;p.vy=0}if(p.x>690&&p.y>370){player.x=50;player.y=410;archive.push(lang==='en'?'Build — reached the playable exit':'제작 — 플레이 가능한 출구 도달');render()}drawPortrait();requestAnimationFrame(tick)}
window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key]=false);$('en').onclick=()=>{lang='en';$('en').classList.add('active');$('ko').classList.remove('active');render()};$('ko').onclick=()=>{lang='ko';$('ko').classList.add('active');$('en').classList.remove('active');render()};$('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;$('theme').textContent=theme==='dark'?'☾':'☀'};render();tick();
</script></body></html>
